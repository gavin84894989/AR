<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>AR 多產品發布管理後台</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js"
    }
  }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #fff; overflow: hidden; }
    #preview-area { flex: 1; position: relative; background: #18181b; }
    #preview-badge {
      position: absolute; top: 14px; left: 14px; z-index: 10;
      background: rgba(15, 23, 42, 0.85); border: 1px solid #007aff;
      color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold;
    }
    #sidebar { width: 460px; background: #ffffff; color: #1e293b; padding: 18px; overflow-y: auto; border-left: 1px solid #cbd5e1; }
    h2 { margin: 0 0 14px 0; font-size: 18px; color: #0f172a; border-bottom: 2px solid #007aff; padding-bottom: 8px; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-bottom: 14px; position: relative; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .card h3 { margin: 0; font-size: 14px; color: #007aff; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 6px 0 3px; color: #475569; }
    input[type="text"], input[type="password"], input[type="number"], select {
      width: 100%; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; background: #fff;
    }
    input[type="file"] { font-size: 12px; width: 100%; }
    input[type="range"] { width: 100%; margin: 2px 0; }
    .row { display: flex; gap: 8px; align-items: center; }
    .col { flex: 1; }
    .hint { font-size: 11px; color: #64748b; margin-top: 3px; }

    .btn-primary-sm {
      background: #007aff; color: #fff; border: none; border-radius: 5px;
      padding: 7px 12px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap;
    }
    .btn-primary-sm:hover { background: #0062cc; }
    .btn-del-card {
      background: #ef4444; color: #fff; border: none; border-radius: 5px;
      padding: 4px 10px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap;
    }
    .btn-del-card:hover { background: #dc2626; }
    .btn-add-layer {
      width: 100%; padding: 10px; margin-bottom: 12px;
      background: #eff6ff; color: #007aff; border: 2px dashed #007aff;
      border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .btn-add-layer:hover { background: #dbeafe; }
    .btn-add-model {
      width: 100%; padding: 10px; margin-bottom: 14px;
      background: #f5f3ff; color: #7c3aed; border: 2px dashed #7c3aed;
      border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .btn-add-model:hover { background: #ede9fe; }

    #hotspot-editor-wrap { margin-top: 10px; display: none; }
    #hotspot-canvas-box {
      position: relative; width: 100%; border: 1px solid #cbd5e1; border-radius: 6px;
      overflow: hidden; cursor: crosshair; background: #0f172a;
    }
    #hotspot-preview-img { width: 100%; display: block; user-select: none; -webkit-user-drag: none; }
    .hs-zone-preview {
      position: absolute; border: 2px dashed rgba(0, 122, 255, 0.85); background: rgba(0, 122, 255, 0.12);
      color: #007aff; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center;
      transform: translate(-50%, -50%); pointer-events: none; border-radius: 6px;
    }

    .hs-card {
      background: #ffffff; border: 1px solid #cbd5e1; border-left: 4px solid #007aff;
      border-radius: 6px; padding: 8px 10px; margin-top: 8px;
    }
    .hs-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .hs-badge { background: #0f172a; color: #fff; font-weight: bold; font-size: 11px; padding: 3px 8px; border-radius: 4px; }
    .hs-del-btn { background: #ef4444; color: #fff; border: none; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 11px; font-weight: bold; }

    #publish-btn { width: 100%; padding: 12px; font-size: 15px; font-weight: bold; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; }
    #publish-btn:disabled { background: #94a3b8; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 12px; font-weight: bold; white-space: pre-wrap; line-height: 1.5; }
    #qr-box { margin-top: 12px; padding: 12px; background: #f1f5f9; border-radius: 8px; text-align: center; display: none; }
    #qrcode { display: flex; justify-content: center; margin-bottom: 8px; }
    #viewer-link-display { font-size: 11px; color: #0284c7; word-break: break-all; display: block; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="preview-area">
    <div id="preview-badge">目前編輯專案：預設專案 (Root)</div>
  </div>

  <div id="sidebar">
    <h2>AR 多產品發布管理後台</h2>

    <!-- GitHub 連線設定 -->
    <div class="card">
      <div class="card-header"><h3>GitHub 連線設定</h3></div>
      <label>儲存庫路徑 (可填 gavin84894889/AR 或完整網址)</label>
      <input type="text" id="gh-repo" placeholder="例如: gavin84894889/AR">
      <label>分支名稱 (預設 main)</label>
      <input type="text" id="gh-branch" value="main">
      <label>個人存取權杖 (Personal Access Token, ghp_...)</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">
    </div>

    <!-- 0. 多產品專案管理中心 -->
    <div class="card" style="border: 2px solid #007aff; background: #eff6ff;">
      <div class="card-header">
        <h3>0. 多產品專案管理中心</h3>
        <button type="button" id="sync-projects-btn" class="btn-primary-sm">🔄 讀取線上清單</button>
      </div>
      <label>選擇要編輯的產品專案</label>
      <div class="row">
        <select id="project-select" style="flex:1; font-weight:bold; color:#0f172a;">
          <option value="">[根目錄預設專案 (相容舊版 QR)]</option>
        </select>
        <button type="button" id="delete-project-btn" class="btn-del-card" style="display:none;">🗑️ 刪除專案</button>
      </div>
      <label style="margin-top:10px;">建立或切換至新產品代號</label>
      <div class="row">
        <input type="text" id="new-project-id" placeholder="例如: product_01" style="flex:1;">
        <button type="button" id="create-project-btn" class="btn-primary-sm">＋ 新增/切換</button>
      </div>
      <label style="margin-top:8px;">產品專案顯示名稱 (顯示於觀看端標題)</label>
      <input type="text" id="project-name-input" placeholder="例如: 2026 春季新品 AR">
    </div>

    <!-- 1. 實體掃描圖卡 -->
    <div class="card">
      <div class="card-header"><h3>1. 實體掃描圖卡 (JPG/PNG)</h3></div>
      <input type="file" id="target-file" accept="image/png, image/jpeg">
      <div id="target-mind-hint" class="hint">若本專案已上傳過 targets.mind 且不換圖可留空</div>
    </div>

    <!-- 2. 浮空提示看板 (純展示) -->
    <div class="card">
      <div class="card-header">
        <h3>2. 浮空提示看板 (純展示)</h3>
        <label style="margin:0; display:flex; align-items:center; gap:4px; cursor:pointer;">
          <input type="checkbox" id="banner-enabled" checked> 顯示看板
        </label>
      </div>
      <label>預設網址範本 (新增點位時自動帶入此網址)</label>
      <input type="text" id="redirect-url" value="https://example.com">
      <label>上方對話框顯示文字</label>
      <input type="text" id="banner-text" value="👉 點擊圖片點位開啟連結！">
      <label>提示看板垂直高度 (Y)</label>
      <input type="range" id="banner-y" min="-1" max="1.5" step="0.05" value="0.65">
    </div>

    <!-- 3. AR 互動圖片與透明感應點位 -->
    <div class="card" style="border-color: #38bdf8; background: #f0f9ff;">
      <div class="card-header">
        <h3>3. AR 互動圖片與點位設定 (唯一可點擊區)</h3>
        <button type="button" id="clear-img-btn" class="btn-del-card">🗑️ 清空移除</button>
      </div>
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
        <input type="checkbox" id="img-layer-enabled"> 啟用 AR 互動圖片圖層
      </label>

      <!-- 【全新功能：後台對位輔助工具區】 -->
      <div style="background:#e0f2fe; border:1px dashed #7dd3fc; border-radius:6px; padding:10px; margin-top:8px;">
        <label style="color:#0284c7; font-weight:bold; margin-top:0;">🔍 後台 3D 對位輔助 (僅影響左側預覽畫面)</label>
        <div class="row">
          <div class="col">
            <label style="color:#0369a1;">圖片預覽透明度</label>
            <input type="range" id="preview-img-opacity" min="0" max="1" step="0.05" value="0.5">
          </div>
          <div class="col" style="padding-top:14px;">
            <label style="display:flex; align-items:center; gap:4px; cursor:pointer; color:#0369a1; margin:0;">
              <input type="checkbox" id="preview-img-top" checked> 強制顯示於最上層
            </label>
          </div>
        </div>
      </div>
      
      <label style="display:flex; align-items:center; gap:6px; cursor:pointer; margin-top:10px; color:#e11d48; font-weight:bold;">
        <input type="checkbox" id="img-hide-body"> 🫥 發布時隱藏本體 (手機端 100% 透明，作為 3D 模型隱形感應板)
      </label>

      <label style="margin-top:8px;">選擇上傳圖片 (PNG/JPG，作為感應點位的參考底圖)</label>
      <input type="file" id="ar-image-file" accept="image/png, image/jpeg, image/webp">
      <div id="current-img-hint" class="hint">目前無使用中的圖片</div>

      <div class="row" style="margin-top:6px;">
        <div class="col"><label>水平 X</label><input type="range" id="img-px" min="-1.2" max="1.2" step="0.05" value="0"></div>
        <div class="col"><label>垂直 Y</label><input type="range" id="img-py" min="-1.2" max="1.2" step="0.05" value="0"></div>
      </div>
      <div class="row">
        <div class="col"><label>圖片大小</label><input type="range" id="img-scale" min="0.3" max="2.0" step="0.05" value="1.0"></div>
        <div class="col"><label>前後深度 Z</label><input type="range" id="img-pz" min="0.02" max="0.35" step="0.01" value="0.10"></div>
      </div>
      <div class="row">
        <div class="col"><label>側向 RY</label><input type="range" id="img-ry" min="-60" max="60" step="1" value="0"></div>
        <div class="col"><label>傾斜 RZ</label><input type="range" id="img-rz" min="-180" max="180" step="1" value="0"></div>
      </div>

      <div id="hotspot-editor-wrap">
        <label style="color:#0284c7; font-weight:bold;">👇 點擊下方圖片新增點位（虛線框僅供後台確認範圍）：</label>
        <div id="hotspot-canvas-box">
          <img id="hotspot-preview-img" alt="AR 互動圖片預覽">
          <div id="hotspot-pins-layer"></div>
        </div>
        <div class="row" style="margin-top:6px; justify-content:space-between;">
          <label style="margin:0; display:flex; align-items:center; gap:4px; cursor:pointer; font-size:11px;">
            <input type="checkbox" id="show-zone-helper" checked> 顯示感應範圍虛線框
          </label>
        </div>
        <div id="hotspot-list"></div>
      </div>
    </div>

    <!-- 4. 去背影片清單 -->
    <div id="video-controls"></div>
    <button type="button" id="add-video-btn" class="btn-add-layer">＋ 新增去背影片圖層 (MP4/WebM)</button>

    <!-- 5. 3D 模型 (.glb) 清單 -->
    <div id="model-controls"></div>
    <button type="button" id="add-model-btn" class="btn-add-model">🧊 ＋ 新增 3D 模型圖層 (.glb)</button>

    <button id="publish-btn">🚀 一鍵發布此專案至 GitHub 並產生 QR</button>
    <div id="status"></div>

    <div id="qr-box">
      <div style="font-size:12px; font-weight:bold; color:#0f172a; margin-bottom:6px;">📱 此產品專案專屬 AR QR Code：</div>
      <div id="qrcode"></div>
      <a id="viewer-link-display" href="#" target="_blank" rel="noopener noreferrer"></a>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { Compiler } from 'mindar-image';

    if (THREE.ColorManagement) { THREE.ColorManagement.enabled = false; }

    const gltfLoader = new GLTFLoader();
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
    gltfLoader.setDRACOLoader(dracoLoader);

    function normalizeUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return '';
      const trimmed = rawUrl.trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return 'https://' + trimmed;
    }

    function sanitizeRepoString(input) {
      let cleaned = (input || '').trim();
      cleaned = cleaned.replace(/^https?:\/\/github\.com\//i, '');
      cleaned = cleaned.replace(/\.git$/i, '');
      cleaned = cleaned.replace(/\s+/g, '');
      cleaned = cleaned.replace(/^\/+|\/+$/g, '');
      return cleaned;
    }

    const repoInput = document.getElementById('gh-repo');
    const branchInput = document.getElementById('gh-branch');
    const tokenInput = document.getElementById('gh-token');
    repoInput.value = localStorage.getItem('ar_gh_repo') || 'gavin84894889/AR';
    branchInput.value = localStorage.getItem('ar_gh_branch') || 'main';
    tokenInput.value = localStorage.getItem('ar_gh_token') || '';

    let currentProjectId = "";
    let currentProjectHasMindFile = false;

    const projectSelect = document.getElementById('project-select');
    const deleteProjectBtn = document.getElementById('delete-project-btn');
    const previewBadge = document.getElementById('preview-badge');
    const targetMindHint = document.getElementById('target-mind-hint');

    function getProjectPrefix(projId = currentProjectId) { return projId ? `projects/${projId}/` : ''; }
    function resolveProjectAssetUrl(rawPath, projId = currentProjectId) {
      if (!rawPath) return '';
      if (/^https?:\/\//i.test(rawPath)) return rawPath;
      const clean = rawPath.replace(/^\.\//, '').replace(/^\/+/, '');
      if (!projId) return `./${clean}`;
      if (clean.startsWith(`projects/${projId}/`)) return `./${clean}`;
      return `./projects/${projId}/${clean}`;
    }
    function getViewerProductionUrl(repo, projId = currentProjectId) {
      const parts = repo.split('/');
      let baseUrl = `${window.location.origin}${window.location.pathname.replace('index.html', '')}viewer.html`;
      if (parts.length === 2) baseUrl = `https://${parts[0]}.github.io/${parts[1]}/viewer.html`;
      return projId ? `${baseUrl}?id=${encodeURIComponent(projId)}` : baseUrl;
    }

    function updateQRDisplay() {
      const repo = sanitizeRepoString(repoInput.value);
      if (!repo) return;
      const url = getViewerProductionUrl(repo, currentProjectId);
      const qrBox = document.getElementById('qr-box');
      const qrContainer = document.getElementById('qrcode');
      const linkEl = document.getElementById('viewer-link-display');
      qrBox.style.display = 'block';
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, { text: url, width: 145, height: 145 });
      linkEl.href = url;
      linkEl.innerText = url;
    }

    const previewArea = document.getElementById('preview-area');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, previewArea.clientWidth / previewArea.clientHeight, 0.1, 100);
    camera.position.set(0, 0, 2.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(previewArea.clientWidth, previewArea.clientHeight);
    previewArea.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 1.8));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
    keyLight.position.set(2, 4, 5); scene.add(keyLight);
    const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
    fillLight.position.set(-2, -2, 3); scene.add(fillLight);

    const refBox = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0x3f3f46, wireframe: true }));
    scene.add(refBox);

    const bannerCvs = document.createElement('canvas');
    bannerCvs.width = 1024; bannerCvs.height = 256;
    const bannerCtx = bannerCvs.getContext('2d');
    const bannerTex = new THREE.CanvasTexture(bannerCvs);
    const bannerMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.32), new THREE.MeshBasicMaterial({ map: bannerTex, transparent: true }));
    scene.add(bannerMesh);

    function updateBannerPreview() {
      bannerMesh.visible = document.getElementById('banner-enabled').checked;
      bannerCtx.clearRect(0, 0, 1024, 256);
      bannerCtx.fillStyle = "rgba(10, 10, 10, 0.85)";
      bannerCtx.beginPath();
      if (bannerCtx.roundRect) bannerCtx.roundRect(20, 20, 984, 216, 40);
      else bannerCtx.rect(20, 20, 984, 216);
      bannerCtx.fill();
      bannerCtx.lineWidth = 8; bannerCtx.strokeStyle = "#007aff"; bannerCtx.stroke();
      bannerCtx.font = "bold 50px sans-serif"; bannerCtx.fillStyle = "#ffffff";
      bannerCtx.textAlign = "center"; bannerCtx.textBaseline = "middle";
      bannerCtx.fillText(document.getElementById('banner-text').value, 512, 128);
      bannerTex.needsUpdate = true;
      bannerMesh.position.set(0, Number(document.getElementById('banner-y').value), 0.12);
    }
    document.getElementById('banner-enabled').addEventListener('change', updateBannerPreview);
    document.getElementById('banner-text').addEventListener('input', updateBannerPreview);
    document.getElementById('banner-y').addEventListener('input', updateBannerPreview);
    updateBannerPreview();

    // =========================================================
    // 影片系統
    // =========================================================
    const vShader = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
    const fShader = `
      uniform sampler2D textureMap; uniform vec3 keyColor; uniform float similarity; uniform float smoothness; varying vec2 vUv;
      void main() {
        vec4 col = texture2D(textureMap, vUv);
        float diff = length(col.rgb - keyColor);
        float alpha = smoothstep(similarity, similarity + max(smoothness, 0.001), diff);
        if (alpha < 0.08) discard;
        gl_FragColor = vec4(col.rgb, col.a * alpha);
      }
    `;

    const videoControlsContainer = document.getElementById('video-controls');
    let videoLayers = [];

    function clearAllVideoLayers() {
      videoLayers.forEach(layer => { layer.videoEl.pause(); layer.videoEl.src = ""; scene.remove(layer.mesh); });
      videoLayers = []; videoControlsContainer.innerHTML = '';
    }

    function createVideoLayerObject(initialData = {}) {
      const id = initialData.id || (`v_${Date.now()}_${Math.floor(Math.random() * 1000)}`);
      const v = document.createElement('video');
      v.loop = true; v.muted = true; v.playsInline = true; v.crossOrigin = "anonymous";
      const tex = new THREE.VideoTexture(v);
      const keyColorStr = initialData.keyColor || "#ffffff";
      const simVal = initialData.similarity !== undefined ? Number(initialData.similarity) : 0.4;
      const smoothVal = initialData.smoothness !== undefined ? Number(initialData.smoothness) : 0.1;

      const mat = new THREE.ShaderMaterial({
        uniforms: { textureMap: { value: tex }, keyColor: { value: new THREE.Color(keyColorStr) }, similarity: { value: simVal }, smoothness: { value: smoothVal } },
        vertexShader: vShader, fragmentShader: fShader, transparent: true, side: THREE.DoubleSide, depthWrite: false
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.55), mat);
      mesh.visible = false; scene.add(mesh);
      const resolvedUrl = initialData.url ? resolveProjectAssetUrl(initialData.url) : "";

      const layerObj = {
        id, url: resolvedUrl, file: null, keyColor: keyColorStr, similarity: simVal, smoothness: smoothVal,
        px: initialData.px !== undefined ? Number(initialData.px) : 0, py: initialData.py !== undefined ? Number(initialData.py) : 0,
        scale: initialData.scale !== undefined ? Number(initialData.scale) : 1.0, ry: initialData.ry !== undefined ? Number(initialData.ry) : 0,
        rz: initialData.rz !== undefined ? Number(initialData.rz) : 0, videoEl: v, mesh, mat, aspect: 1.0
      };

      if (layerObj.url) {
        fetch(`${layerObj.url}?t=${Date.now()}`, { method: 'HEAD' }).then(res => {
          if (res.ok) {
            v.src = `${layerObj.url}?t=${Date.now()}`; v.play().catch(() => {});
            v.onloadedmetadata = () => {
              layerObj.aspect = (v.videoWidth || 1) / (v.videoHeight || 1);
              mesh.scale.set(layerObj.aspect * layerObj.scale, layerObj.scale, 1); mesh.visible = true;
            };
          }
        }).catch(() => {});
      }
      return layerObj;
    }

    function renderVideoCardsUI() {
      videoControlsContainer.innerHTML = '';
      videoLayers.forEach((layer, idx) => {
        const card = document.createElement('div'); card.className = 'card';
        const fileStatusText = layer.file ? `✅ 已選取新檔案：${layer.file.name}` : (layer.url ? `📁 目前沿用專案檔案：${layer.url}` : `⚠️ 尚未選取影片檔案`);
        card.innerHTML = `
          <div class="card-header">

    function loadGltfIntoLayer(layerObj, srcUrl) {
      while (layerObj.scaleHolder.children.length > 0) layerObj.scaleHolder.remove(layerObj.scaleHolder.children[0]);
      layerObj.mixer = null;
      gltfLoader.load(srcUrl, (gltf) => {
        const rawModel = gltf.scene;
        const box = new THREE.Box3().setFromObject(rawModel);
        const size = new THREE.Vector3(); const center = new THREE.Vector3();
        box.getSize(size); box.getCenter(center);
        const normFactor = 0.6 / Math.max(size.x, size.y, size.z, 0.001);
        rawModel.position.set(-center.x * normFactor, -center.y * normFactor, -center.z * normFactor);
        rawModel.scale.setScalar(normFactor);
        layerObj.scaleHolder.add(rawModel); layerObj.scaleHolder.scale.setScalar(layerObj.scale); layerObj.wrapperGroup.visible = true;
        if (gltf.animations && gltf.animations.length > 0) {
          layerObj.mixer = new THREE.AnimationMixer(rawModel);
          gltf.animations.forEach(clip => layerObj.mixer.clipAction(clip).play());
        }
      }, undefined, () => {});
    }

    function createModelLayerObject(initialData = {}) {
      const id = initialData.id || (`m_${Date.now()}_${Math.floor(Math.random() * 1000)}`);
      const wrapperGroup = new THREE.Group(); wrapperGroup.visible = false;
      const scaleHolder = new THREE.Group(); wrapperGroup.add(scaleHolder); scene.add(wrapperGroup);
      const resolvedUrl = initialData.url ? resolveProjectAssetUrl(initialData.url) : "";

      const layerObj = {
        id, url: resolvedUrl, file: null,
        px: initialData.px !== undefined ? Number(initialData.px) : 0, py: initialData.py !== undefined ? Number(initialData.py) : 0,
        pz: initialData.pz !== undefined ? Number(initialData.pz) : 0.15, scale: initialData.scale !== undefined ? Number(initialData.scale) : 1.0,
        rx: initialData.rx !== undefined ? Number(initialData.rx) : 0, ry: initialData.ry !== undefined ? Number(initialData.ry) : 0, rz: initialData.rz !== undefined ? Number(initialData.rz) : 0,
        autoRotate: !!initialData.autoRotate, wrapperGroup, scaleHolder, mixer: null
      };

      if (layerObj.url) {
        fetch(`${layerObj.url}?t=${Date.now()}`, { method: 'HEAD' }).then(res => {
          if (res.ok) loadGltfIntoLayer(layerObj, `${layerObj.url}?t=${Date.now()}`);
        }).catch(() => {});
      }
      return layerObj;
    }

        previewImgMesh.renderOrder = onTop ? 999 : 15;
        previewImgGroup.add(previewImgMesh);
      });
    }

    async function fetchProjectListFromGitHub() {
      const repo = sanitizeRepoString(repoInput.value); const branch = branchInput.value.trim() || 'main'; const token = tokenInput.value.trim();
      if (!repo) return;
      try {
        const headers = { "Accept": "application/vnd.github+json" }; if (token) headers["Authorization"] = `Bearer ${token}`;
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/projects?ref=${branch}&_t=${Date.now()}`, { headers });
        const existingSelection = projectSelect.value;
        projectSelect.innerHTML = `<option value="">[根目錄預設專案 (相容舊版 QR)]</option>`;
        if (res.ok) {
          const items = await res.json();
          if (Array.isArray(items)) items.filter(item => item.type === 'dir').forEach(dir => {
            const opt = document.createElement('option'); opt.value = dir.name; opt.innerText = `📦 專案：${dir.name}`; projectSelect.appendChild(opt);
          });
        }
        if (existingSelection && !Array.from(projectSelect.options).some(o => o.value === existingSelection)) {
          const opt = document.createElement('option'); opt.value = existingSelection; opt.innerText = `✨ 新專案 (待發布)：${existingSelection}`; projectSelect.appendChild(opt);
        }
        projectSelect.value = existingSelection;
      } catch (e) { console.warn("讀取專案列表:", e); }
    }

    async function loadProjectConfig(projId) {
      currentProjectId = projId; previewBadge.innerText = projId ? `目前編輯專案：${projId}` : `目前編輯專案：預設專案 (Root)`;
      deleteProjectBtn.style.display = projId ? 'inline-block' : 'none'; document.getElementById('target-file').value = '';
      clearAllVideoLayers(); clearAllModelLayers(); clearImageLayerState();

      const repo = sanitizeRepoString(repoInput.value); const branch = branchInput.value.trim() || 'main'; const token = tokenInput.value.trim();
      const prefix = getProjectPrefix(projId);

      currentProjectHasMindFile = false;
      try {
        const mindRes = await fetch(`${resolveProjectAssetUrl('targets.mind', projId)}?t=${Date.now()}`, { method: 'HEAD' });
        if (mindRes.ok) currentProjectHasMindFile = true;
      } catch (e) {}

      targetMindHint.style.color = currentProjectHasMindFile ? '#0284c7' : '#f59e0b';
      targetMindHint.innerText = currentProjectHasMindFile ? `✅ 此專案已有 targets.mind（若不更換辨識圖可留空）` : `⚠️ 此為新專案，首次發布請務必選擇上傳一張實體掃描圖卡！`;

      let cfg = null;
      if (repo && token) {
        try {
          const apiRes = await fetch(`https://api.github.com/repos/${repo}/contents/${prefix}config.json?ref=${branch}&_t=${Date.now()}`, { headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" } });
          if (apiRes.ok) { const fileData = await apiRes.json(); cfg = JSON.parse(decodeURIComponent(escape(atob(fileData.content.replace(/\s/g, ''))))); }
        } catch (e) {}
      }
      if (!cfg) {
        try { const localRes = await fetch(`${resolveProjectAssetUrl('config.json', projId)}?t=${Date.now()}`); if (localRes.ok) cfg = await localRes.json(); } catch (e) {}
      }

      updateQRDisplay();

      if (!cfg) {
        document.getElementById('project-name-input').value = projId ? `產品專案 ${projId}` : '';
        document.getElementById('banner-enabled').checked = true; document.getElementById('redirect-url').value = 'https://example.com'; document.getElementById('banner-text').value = '👉 點擊圖片點位開啟連結！'; document.getElementById('banner-y').value = 0.65;
        updateBannerPreview(); videoLayers.push(createVideoLayerObject({ px: 0, py: 0 })); renderVideoCardsUI(); renderModelCardsUI(); return;
      }

      document.getElementById('project-name-input').value = cfg.projectName || '';
      document.getElementById('banner-enabled').checked = (cfg.bannerEnabled !== false);
      if (cfg.redirectUrl) document.getElementById('redirect-url').value = cfg.redirectUrl;
      if (cfg.bannerText !== undefined) document.getElementById('banner-text').value = cfg.bannerText;
      if (cfg.bannerPosY !== undefined) document.getElementById('banner-y').value = cfg.bannerPosY;
      updateBannerPreview();

      if (Array.isArray(cfg.videos)) { cfg.videos.forEach(vConf => { if (vConf && vConf.url) videoLayers.push(createVideoLayerObject(vConf)); }); }
      renderVideoCardsUI();

      if (Array.isArray(cfg.models)) { cfg.models.forEach(mConf => { if (mConf && mConf.url) modelLayers.push(createModelLayerObject(mConf)); }); }
      renderModelCardsUI();

      if (cfg.imageLayer) {
        imgEnabledCheckbox.checked = !!cfg.imageLayer.enabled;
        imgHideBodyCheckbox.checked = !!cfg.imageLayer.hideBody;
        if (cfg.imageLayer.px !== undefined) document.getElementById('img-px').value = cfg.imageLayer.px;
        if (cfg.imageLayer.py !== undefined) document.getElementById('img-py').value = cfg.imageLayer.py;
        if (cfg.imageLayer.pz !== undefined) document.getElementById('img-pz').value = cfg.imageLayer.pz;
        if (cfg.imageLayer.scale !== undefined) document.getElementById('img-scale').value = cfg.imageLayer.scale;
        if (cfg.imageLayer.ry !== undefined) document.getElementById('img-ry').value = cfg.imageLayer.ry;
        if (cfg.imageLayer.rz !== undefined) document.getElementById('img-rz').value = cfg.imageLayer.rz;

        if (Array.isArray(cfg.imageLayer.hotspots)) { hotspotsData = cfg.imageLayer.hotspots; renderHotspotEditorUI(); }
        if (cfg.imageLayer.enabled && cfg.imageLayer.url) {
          existingImageUrl = resolveProjectAssetUrl(cfg.imageLayer.url, projId);
          currentImgHint.innerText = `📁 目前沿用專案圖片：${existingImageUrl}`;
          previewImgEl.src = `${existingImageUrl}?t=${Date.now()}`; editorWrap.style.display = 'block';
          previewImgEl.onload = () => {
            currentImageAspect = (previewImgEl.naturalWidth || 1) / (previewImgEl.naturalHeight || 1);
            rebuild3DImagePreview(previewImgEl.src); updateZonePreviewBoxes();
          };
        }
      }
    }

    document.getElementById('sync-projects-btn').addEventListener('click', async () => { await fetchProjectListFromGitHub(); await loadProjectConfig(projectSelect.value); });
    projectSelect.addEventListener('change', () => { loadProjectConfig(projectSelect.value); });
    document.getElementById('create-project-btn').addEventListener('click', async () => {
      const safeId = document.getElementById('new-project-id').value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
      if (!safeId) { alert("請輸入有效的專案代號！"); return; }
      if (!Array.from(projectSelect.options).some(o => o.value === safeId)) {
        const opt = document.createElement('option'); opt.value = safeId; opt.innerText = `✨ 新專案 (待發布)：${safeId}`; projectSelect.appendChild(opt);
      }
      projectSelect.value = safeId; document.getElementById('new-project-id').value = ''; await loadProjectConfig(safeId);
    });

    deleteProjectBtn.addEventListener('click', async () => {
      if (!currentProjectId || !confirm(`確定要刪除「${currentProjectId}」專案嗎？`)) return;
      const repo = sanitizeRepoString(repoInput.value); const branch = branchInput.value.trim() || 'main'; const token = tokenInput.value.trim(); const status = document.getElementById('status');
      if (!repo || !token) return;
      try {
        status.style.color = "#f59e0b"; status.innerText = `⏳ 正在移除專案 ${currentProjectId}...`;
        const getRes = await fetch(`https://api.github.com/repos/${repo}/contents/projects/${currentProjectId}/config.json?ref=${branch}&_t=${Date.now()}`, { headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" } });
        if (getRes.ok) {
          const fileData = await getRes.json();
          await fetch(`https://api.github.com/repos/${repo}/contents/projects/${currentProjectId}/config.json`, { method: "DELETE", headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify({ message: `Delete project ${currentProjectId}`, sha: fileData.sha, branch }) });
        }
        status.style.color = "#10b981"; status.innerText = `✅ 已刪除專案 ${currentProjectId}`; projectSelect.value = ""; await fetchProjectListFromGitHub(); await loadProjectConfig("");
      } catch (err) { status.style.color = "#ef4444"; status.innerText = `❌ 刪除失敗：${err.message}`; }
    });

    (async () => { await fetchProjectListFromGitHub(); await loadProjectConfig(""); })();

    const previewClock = new THREE.Clock();
    function animatePreview() {
      requestAnimationFrame(animatePreview);
      const delta = previewClock.getDelta();

      videoLayers.forEach((layer, i) => {
        layer.mesh.position.set(layer.px, layer.py, 0.15 + i * 0.02);
        layer.mesh.rotation.y = THREE.MathUtils.degToRad(layer.ry); layer.mesh.rotation.z = THREE.MathUtils.degToRad(layer.rz);
      });

      modelLayers.forEach((mLayer) => {
        mLayer.wrapperGroup.position.set(mLayer.px, mLayer.py, mLayer.pz);
        mLayer.wrapperGroup.rotation.x = THREE.MathUtils.degToRad(mLayer.rx); mLayer.wrapperGroup.rotation.z = THREE.MathUtils.degToRad(mLayer.rz);
        if (mLayer.autoRotate) mLayer.wrapperGroup.rotation.y += delta * 1.2; else mLayer.wrapperGroup.rotation.y = THREE.MathUtils.degToRad(mLayer.ry);
        if (mLayer.mixer) mLayer.mixer.update(delta);
      });

      previewImgGroup.visible = imgEnabledCheckbox.checked && !!previewImgMesh;
      previewImgGroup.position.set(Number(document.getElementById('img-px').value), Number(document.getElementById('img-py').value), Number(document.getElementById('img-pz').value));
      previewImgGroup.rotation.y = THREE.MathUtils.degToRad(Number(document.getElementById('img-ry').value)); previewImgGroup.rotation.z = THREE.MathUtils.degToRad(Number(document.getElementById('img-rz').value));

      renderer.render(scene, camera);
    }
    animatePreview();

    window.addEventListener('resize', () => { camera.aspect = previewArea.clientWidth / previewArea.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(previewArea.clientWidth, previewArea.clientHeight); updateZonePreviewBoxes(); });

    function fileToBase64(fileOrBlob) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(fileOrBlob); }); }

    async function uploadToGitHub(repo, branch, token, path, base64Content, commitMsg) {
      const url = `https://api.github.com/repos/${repo}/contents/${path}`; let sha = undefined;
      try {
        const getRes = await fetch(`${url}?ref=${branch}&_t=${Date.now()}`, { headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json" } });
        if (getRes.ok) { const fileData = await getRes.json(); sha = fileData.sha; }
      } catch (e) {}
      const res = await fetch(url, { method: "PUT", headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github+json", "Content-Type": "application/json" }, body: JSON.stringify({ message: commitMsg, content: base64Content, branch, sha }) });
      if (!res.ok) { const errJson = await res.json(); throw new Error(errJson.message || `上傳 ${path} 失敗`); }
      return true;
    }

    document.getElementById('publish-btn').addEventListener('click', async () => {
      syncHotspotInputsFromDOM();
      const btn = document.getElementById('publish-btn'); const status = document.getElementById('status');
      const repo = sanitizeRepoString(repoInput.value); const branch = branchInput.value.trim() || 'main'; const token = tokenInput.value.trim();

      if (!repo || !token) { alert("請填寫 GitHub 儲存庫路徑與 Token！"); return; }
      const targetFile = document.getElementById('target-file').files[0];
      if (!targetFile && !currentProjectHasMindFile) { if (!confirm("系統偵測到此新專案尚未上傳過實體掃描圖卡，確定仍要繼續嗎？")) return; }

      localStorage.setItem('ar_gh_repo', repo); localStorage.setItem('ar_gh_branch', branch); localStorage.setItem('ar_gh_token', token);
      const prefix = getProjectPrefix(currentProjectId); const projLabel = currentProjectId || '預設專案 (Root)';
      btn.disabled = true; status.style.color = "#0284c7";

      try {
        if (targetFile) {
          status.innerText = `⏳ [${projLabel}] 正在編譯掃描圖卡 targets.mind...`;
          const img = new Image(); img.src = URL.createObjectURL(targetFile); await new Promise(r => img.onload = r);
          const compiler = new Compiler(); await compiler.compileImageTargets([img], (p) => { status.innerText = `⏳ [${projLabel}] 正在編譯圖卡特徵... ${p.toFixed(0)}%`; });
          const exportedBuffer = await compiler.exportData(); const mindB64 = await fileToBase64(new Blob([exportedBuffer]));
          status.innerText = `⏳ [${projLabel}] 正在上傳 ${prefix}targets.mind...`;
          await uploadToGitHub(repo, branch, token, `${prefix}targets.mind`, mindB64, `Update ${prefix}targets.mind`);
          currentProjectHasMindFile = true;
        }

        const videosConfig = [];
        for (let i = 0; i < videoLayers.length; i++) {
          const layer = videoLayers[i]; let finalVideoUrl = layer.url;
          if (layer.file) {
            const vRepoPath = `${prefix}videos/video_${layer.id}.mp4`; status.innerText = `⏳ [${projLabel}] 正在上傳影片 #${i + 1}...`;
            await uploadToGitHub(repo, branch, token, vRepoPath, await fileToBase64(layer.file), `Upload ${vRepoPath}`);
            finalVideoUrl = `./${vRepoPath}`; layer.url = finalVideoUrl; layer.file = null;
          }
          if (finalVideoUrl) videosConfig.push({ id: layer.id, enabled: true, url: finalVideoUrl, keyColor: layer.keyColor, similarity: layer.similarity, smoothness: layer.smoothness, px: layer.px, py: layer.py, scale: layer.scale, ry: layer.ry, rz: layer.rz });
        }

        const modelsConfig = [];
        for (let i = 0; i < modelLayers.length; i++) {
          const mLayer = modelLayers[i]; let finalModelUrl = mLayer.url;
          if (mLayer.file) {
            const mRepoPath = `${prefix}models/model_${mLayer.id}.glb`; status.innerText = `⏳ [${projLabel}] 正在上傳 3D 模型 #${i + 1}...`;
            await uploadToGitHub(repo, branch, token, mRepoPath, await fileToBase64(mLayer.file), `Upload ${mRepoPath}`);
            finalModelUrl = `./${mRepoPath}`; mLayer.url = finalModelUrl; mLayer.file = null;
          }
          if (finalModelUrl) modelsConfig.push({ id: mLayer.id, enabled: true, url: finalModelUrl, px: mLayer.px, py: mLayer.py, pz: mLayer.pz, scale: mLayer.scale, rx: mLayer.rx, ry: mLayer.ry, rz: mLayer.rz, autoRotate: mLayer.autoRotate });
        }

        const arImgFile = arImageInput.files[0]; let finalImgUrl = existingImageUrl;
        if (arImgFile && imgEnabledCheckbox.checked) {
          const imgRepoPath = `${prefix}images/ar_overlay.png`; status.innerText = `⏳ [${projLabel}] 正在上傳 AR 互動圖片...`;
          await uploadToGitHub(repo, branch, token, imgRepoPath, await fileToBase64(arImgFile), `Update ${imgRepoPath}`);
          finalImgUrl = `./${imgRepoPath}`; existingImageUrl = finalImgUrl;
        }

        status.innerText = `⏳ [${projLabel}] 正在更新 ${prefix}config.json 設定檔...`;
        const configObj = {
          projectId: currentProjectId || "root", projectName: document.getElementById('project-name-input').value.trim(),
          bannerEnabled: document.getElementById('banner-enabled').checked, redirectUrl: normalizeUrl(document.getElementById('redirect-url').value) || "https://example.com",
          bannerText: document.getElementById('banner-text').value, bannerPosY: Number(document.getElementById('banner-y').value),
          videos: videosConfig, models: modelsConfig,
          imageLayer: {
            enabled: imgEnabledCheckbox.checked && !!finalImgUrl,
            hideBody: imgHideBodyCheckbox.checked,
            url: imgEnabledCheckbox.checked ? finalImgUrl : "",
            px: Number(document.getElementById('img-px').value), py: Number(document.getElementById('img-py').value), pz: Number(document.getElementById('img-pz').value),
            scale: Number(document.getElementById('img-scale').value), ry: Number(document.getElementById('img-ry').value), rz: Number(document.getElementById('img-rz').value),
            hotspots: imgEnabledCheckbox.checked ? hotspotsData : []
          }
        };

        await uploadToGitHub(repo, branch, token, `${prefix}config.json`, btoa(unescape(encodeURIComponent(JSON.stringify(configObj, null, 2)))), `Update ${prefix}config.json`);
        await fetchProjectListFromGitHub(); renderVideoCardsUI(); renderModelCardsUI(); updateQRDisplay();
        status.style.color = "#10b981"; status.innerText = `✅ 專案【${projLabel}】發布成功！\n專屬觀看網址：\n${getViewerProductionUrl(repo, currentProjectId)}`;
      } catch (err) {
        console.error(err); status.style.color = "#ef4444"; status.innerText = `❌ 發布失敗：${err.message}`;
      } finally { btn.disabled = false; }
    });
  </script>
</body>
</html>
