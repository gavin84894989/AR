<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- 防快取標籤 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR 觀看端</title>

  <!-- 官方同源模組映射 (Three.js r160 + MindAR 1.2.5) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
    }

    #ar-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
    }

    #ar-container video {
      z-index: 1 !important;
      pointer-events: none;
    }
    #ar-container canvas {
      z-index: 2 !important;
      pointer-events: auto !important;
      cursor: pointer;
    }

    /* 隱藏預載影片池 */
    #video-preload-pool {
      position: fixed; bottom: 0; right: 0;
      width: 1px; height: 1px; opacity: 0.01;
      pointer-events: none; z-index: -1;
    }

    /* 頂部簡潔追蹤狀態燈 */
    #tracker-hud {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 1000; padding: 8px 18px; border-radius: 20px;
      font-size: 14px; font-weight: bold; color: white;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      display: none; pointer-events: none; white-space: nowrap;
    }

    /* 啟動遮罩 */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 2000; color: white;
      text-align: center; padding: 20px;
    }

    #start-btn {
      padding: 15px 36px; font-size: 18px; border: none; border-radius: 30px;
      background: #007aff; color: white; cursor: pointer; font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
    }
    #start-btn:disabled { background: #555; box-shadow: none; }

    #status-msg {
      margin-top: 15px; font-size: 14px; line-height: 1.5;
      white-space: pre-wrap; max-width: 90%; color: #94a3b8;
    }
    .text-error { color: #ff4d4f !important; font-weight: bold; }
  </style>
</head>
<body>

  <div id="tracker-hud">🟡 正在尋找目標圖卡...</div>

  <div id="overlay">
    <h2>WebAR 互動體驗</h2>
    <button id="start-btn" disabled>連線中...</button>
    <div id="status-msg">正在檢查環境與載入設定檔...</div>
  </div>

  <div id="ar-container"></div>
  <div id="video-preload-pool"></div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const statusMsg = document.getElementById('status-msg');
    const hud = document.getElementById('tracker-hud');
    const preloadPool = document.getElementById('video-preload-pool');

    let THREE = null;
    let MindARThree = null;
    let config = null;
    const validVideoItems = [];
    let validImageLayer = null;

    // 網址正規化：自動補齊 https://，若空白則回傳空字串
    function normalizeUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return '';
      const trimmed = rawUrl.trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return 'https://' + trimmed;
    }

    function checkInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf('Line') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1) {
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerHTML = "⚠️ <b>無法在通訊軟體內建瀏覽器中開啟</b><br><br>請點選右上角選單：<br>👉 選擇<b>「以 Safari / Chrome 開啟」</b>。";
        return true;
      }
      return false;
    }

    async function checkAssetExists(url) {
      if (!url) return false;
      try {
        const res = await fetch(`${url}?t=${Date.now()}`, { method: 'HEAD' });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    // 繪製原版簡潔圓角浮空文字框
    function createCleanBannerTexture(text) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 256;
      const ctx = cvs.getContext('2d');

      ctx.fillStyle = "rgba(10, 10, 10, 0.85)";
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(20, 20, 984, 216, 40);
      } else {
        ctx.rect(20, 20, 984, 216);
      }
      ctx.fill();

      ctx.lineWidth = 8;
      ctx.strokeStyle = "#007aff";
      ctx.stroke();

      ctx.font = "bold 50px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text || "👉 點擊任意影片前往官方網站！", 512, 128);

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    async function init() {
      if (checkInAppBrowser()) return;

      try {
        statusMsg.innerText = "⏳ 1/3 正在讀取 config.json 設定檔...";
        const res = await fetch(`./config.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`找不到 config.json (HTTP ${res.status})`);
        config = await res.json();

        statusMsg.innerText = "⏳ 2/3 正在載入 3D 與 AR 核心引擎...";
        THREE = await import('three');
        const mindarModule = await import('mindar-image-three');
        MindARThree = mindarModule.MindARThree;

        if (THREE.ColorManagement) {
          THREE.ColorManagement.enabled = false;
        }

        statusMsg.innerText = "⏳ 3/3 正在檢查已發布的媒體資產...";
        if (config.videos && Array.isArray(config.videos)) {
          for (let i = 0; i < config.videos.length; i++) {
            const vConf = config.videos[i];
            const exists = await checkAssetExists(vConf.url);
            if (exists) {
              const v = document.createElement('video');
              v.src = `${vConf.url}?t=${Date.now()}`;
              v.loop = true;
              v.muted = true;
              v.playsInline = true;
              v.setAttribute('loop', '');
              v.setAttribute('muted', '');
              v.setAttribute('playsinline', '');
              v.setAttribute('webkit-playsinline', '');
              v.setAttribute('preload', 'auto');
              v.crossOrigin = "anonymous";

              v.addEventListener('ended', () => {
                v.currentTime = 0;
                v.play().catch(() => {});
              });

              preloadPool.appendChild(v);
              v.load();
              validVideoItems.push({ index: i + 1, element: v, config: vConf });
            }
          }
        }

        if (config.imageLayer && config.imageLayer.enabled && config.imageLayer.url) {
          const imgExists = await checkAssetExists(config.imageLayer.url);
          if (imgExists) {
            validImageLayer = config.imageLayer;
          }
        }

        const imgInfo = validImageLayer ? ` + 1 張互動圖片` : "";
        statusMsg.innerText = `✅ 準備就緒（偵測到 ${validVideoItems.length} 支影片${imgInfo}）\n請將鏡頭對準實體圖卡`;
        startBtn.innerText = "點擊啟動 AR 鏡頭";
        startBtn.disabled = false;
        startBtn.onclick = startAR;

      } catch (err) {
        console.error(err);
        statusMsg.className = 'text-error';
        statusMsg.innerText = `初始化失敗：\n${err.message}`;
        startBtn.innerText = "載入失敗";
      }
    }

    async function startAR() {
      startBtn.disabled = true;
      startBtn.innerText = "相機啟動中...";

      validVideoItems.forEach(item => {
        item.element.play().catch(e => console.warn(`影片 ${item.index} 初始喚醒:`, e));
      });

      try {
        const container = document.querySelector("#ar-container");

        const mindarThree = new MindARThree({
          container: container,
          imageTargetSrc: `./targets.mind?t=${Date.now()}`,
          uiLoading: "no",
          uiScanning: "no",
          filterMinCF: 0.001,
          filterBeta: 0.01,
          missTolerance: 5,
          warmupTolerance: 2
        });

        const { renderer, scene, camera } = mindarThree;
        renderer.setClearColor(0x000000, 0);

        const anchor = mindarThree.addAnchor(0);
        const defaultRedirectUrl = normalizeUrl(config.redirectUrl) || "https://example.com";

        const hotspotClickables = []; // 第一優先：圖片透明點位
        const generalClickables = []; // 第二優先：浮空文字框、影片、圖片本體
        let interactiveImageMesh = null;

        // =========================================================
        // A. 簡潔浮空文字看板
        // =========================================================
        const bannerTexture = createCleanBannerTexture(config.bannerText);
        const bannerW = 1.3, bannerH = 0.32;
        const bannerMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(bannerW, bannerH),
          new THREE.MeshBasicMaterial({
            map: bannerTexture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        const baseBannerY = (config.bannerPosY !== undefined) ? Number(config.bannerPosY) : 0.65;
        bannerMesh.position.set(0, baseBannerY, 0.12);
        bannerMesh.renderOrder = 20;
        bannerMesh.userData = {
          targetUrl: defaultRedirectUrl,
          halfW: bannerW / 2,
          halfH: bannerH / 2
        };
        anchor.group.add(bannerMesh);
        generalClickables.push(bannerMesh);

        // =========================================================
        // B. 純淨去背影片平面
        // =========================================================
        const vShader = `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `;
        const fShader = `
          uniform sampler2D textureMap;
          uniform vec3 keyColor;
          uniform float similarity;
          uniform float smoothness;
          varying vec2 vUv;

          void main() {
            vec4 col = texture2D(textureMap, vUv);
            float diff = length(col.rgb - keyColor);
            float alpha = smoothstep(similarity, similarity + smoothness, diff);
            gl_FragColor = vec4(col.rgb, col.a * alpha);
          }
        `;

        const activeVideoObjects = [];
        const basePlaneHeight = 0.55;

        validVideoItems.forEach((item, idx) => {
          const v = item.element;
          const vConfig = item.config;

          const vTexture = new THREE.VideoTexture(v);
          vTexture.minFilter = THREE.LinearFilter;
          vTexture.magFilter = THREE.LinearFilter;

          const mat = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: vTexture },
              keyColor: { value: new THREE.Color(vConfig.keyColor || "#00ff00") },
              similarity: { value: Number(vConfig.similarity ?? 0.4) },
              smoothness: { value: Number(vConfig.smoothness ?? 0.1) }
            },
            vertexShader: vShader,
            fragmentShader: fShader,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(basePlaneHeight, basePlaneHeight), mat);

          const baseX = Number(vConfig.px || 0);
          const baseY = Number(vConfig.py || 0);
          const baseZ = 0.15 + idx * 0.02;
          const baseRY = THREE.MathUtils.degToRad(Number(vConfig.ry || 0));
          const baseRZ = THREE.MathUtils.degToRad(Number(vConfig.rz || 0));

          mesh.position.set(baseX, baseY, baseZ);
          mesh.rotation.set(0, baseRY, baseRZ);
          mesh.renderOrder = 10 + idx;
          mesh.userData = {
            targetUrl: normalizeUrl(vConfig.linkUrl) || defaultRedirectUrl,
            halfW: basePlaneHeight / 2,
            halfH: basePlaneHeight / 2
          };

          anchor.group.add(mesh);
          generalClickables.push(mesh);

          activeVideoObjects.push({
            video: v,
            texture: vTexture,
            mesh: mesh,
            aspectCalibrated: false
          });
        });

        // =========================================================
        // C. AR 互動圖片與「100% 全透明」點位感應區
        // =========================================================
        if (validImageLayer) {
          const imgGroup = new THREE.Group();
          const imgX = Number(validImageLayer.px || 0);
          const imgY = Number(validImageLayer.py || 0);
          const imgZ = Number(validImageLayer.pz ?? 0.10);
          const imgRY = THREE.MathUtils.degToRad(Number(validImageLayer.ry || 0));
          const imgRZ = THREE.MathUtils.degToRad(Number(validImageLayer.rz || 0));
          const imgScale = Number(validImageLayer.scale || 1.0);

          imgGroup.position.set(imgX, imgY, imgZ);
          imgGroup.rotation.set(0, imgRY, imgRZ);
          anchor.group.add(imgGroup);

          const texLoader = new THREE.TextureLoader();
          texLoader.setCrossOrigin("anonymous");
          texLoader.load(`${validImageLayer.url}?t=${Date.now()}`, (imgTex) => {
            const imgW = imgTex.image.width || 1;
            const imgH = imgTex.image.height || 1;
            const aspect = imgW / imgH;

            const planeH = 0.65 * imgScale;
            const planeW = planeH * aspect;

            const imgMat = new THREE.MeshBasicMaterial({
              map: imgTex,
              transparent: true,
              side: THREE.DoubleSide,
              depthWrite: false
            });
            const imgMesh = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), imgMat);
            imgMesh.renderOrder = 15;
            imgMesh.userData = {
              targetUrl: defaultRedirectUrl,
              halfW: planeW / 2,
              halfH: planeH / 2
            };
            imgGroup.add(imgMesh);
            interactiveImageMesh = imgMesh;
            generalClickables.push(imgMesh);

            // 建立全透明點位感應區 (opacity: 0，若點位未填網址則自動保底使用預設連結)
            const hotspots = Array.isArray(validImageLayer.hotspots) ? validImageLayer.hotspots : [];
            hotspots.forEach((spot) => {
              const spotTargetUrl = normalizeUrl(spot.url) || defaultRedirectUrl;
              const uvX = Number(spot.uvX ?? 0.5);
              const uvY = Number(spot.uvY ?? 0.5);

              const localX = (uvX - 0.5) * planeW;
              const localY = (0.5 - uvY) * planeH;

              const hsMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.0,
                side: THREE.DoubleSide,
                depthWrite: false
              });

              const hitSize = Math.max(0.18, 0.20 * imgScale);
              const hsMesh = new THREE.Mesh(new THREE.PlaneGeometry(hitSize, hitSize), hsMat);
              hsMesh.position.set(localX, localY, 0.01);
              hsMesh.userData = {
                targetUrl: spotTargetUrl,
                isHotspot: true,
                halfW: hitSize / 2,
                halfH: hitSize / 2
              };

              imgGroup.add(hsMesh);
              hotspotClickables.push(hsMesh);
            });
          });
        }

        // =========================================================
        // D. 追蹤狀態與防手震記憶矩陣
        // =========================================================
        let isTargetLocked = false;
        let lastLockedTime = 0;
        const lastValidAnchorMatrix = new THREE.Matrix4();

        anchor.onTargetFound = () => {
          isTargetLocked = true;
          lastLockedTime = performance.now();
          hud.style.background = "rgba(40, 167, 69, 0.9)";
          hud.innerHTML = "🟢 目標已鎖定！";
          validVideoItems.forEach(item => {
            if (item.element.paused) item.element.play().catch(() => {});
          });
        };

        anchor.onTargetLost = () => {
          isTargetLocked = false;
          hud.style.background = "rgba(0, 0, 0, 0.75)";
          hud.innerHTML = "🟡 正在尋找目標圖卡...";
        };

        await mindarThree.start();

        overlay.style.display = 'none';
        hud.style.display = 'block';

        // =========================================================
        // E. 螢幕旋轉校正 (保留 MindAR 原生投影矩陣並同步逆矩陣)
        // =========================================================
        window.addEventListener('orientationchange', () => {
          setTimeout(() => window.dispatchEvent(new Event('resize')), 150);
          setTimeout(() => window.dispatchEvent(new Event('resize')), 350);
        });

        // =========================================================
        // F. 渲染迴圈：無限循環巡檢、比例校正與記憶最後鎖定矩陣
        // =========================================================
        renderer.setAnimationLoop(() => {
          if (isTargetLocked) {
            lastLockedTime = performance.now();
            lastValidAnchorMatrix.copy(anchor.group.matrix);
          }

          activeVideoObjects.forEach(vo => {
            const v = vo.video;

            if (isTargetLocked) {
              if (v.duration > 0 && v.currentTime >= v.duration - 0.05) {
                v.currentTime = 0;
                v.play().catch(() => {});
              } else if (v.paused || v.ended) {
                if (v.ended) v.currentTime = 0;
                v.play().catch(() => {});
              }
            }

            if (v.readyState >= v.HAVE_CURRENT_DATA) {
              vo.texture.needsUpdate = true;

              if (!vo.aspectCalibrated && v.videoWidth > 0 && v.videoHeight > 0) {
                const aspect = v.videoWidth / v.videoHeight;
                vo.mesh.scale.set(aspect, 1, 1);
                vo.aspectCalibrated = true;
              }
            }
          });

          renderer.render(scene, camera);
        });

        // =========================================================
        // G. 雙引擎點擊跳轉判定 (3D Raycaster + 2D 螢幕投影邊界雙重檢測)
        // =========================================================
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let isNavigating = false;

        // 輔助函式：檢查螢幕點擊座標 (ndcX, ndcY) 是否落在 3D 平面投影至螢幕的矩形範圍內
        function isPointInProjectedMesh(mesh, ndcX, ndcY, pad = 0.06) {
          const hw = mesh.userData.halfW || 0.3;
          const hh = mesh.userData.halfH || 0.2;
          const corners = [
            new THREE.Vector3(-hw, -hh, 0),
            new THREE.Vector3( hw, -hh, 0),
            new THREE.Vector3( hw,  hh, 0),
            new THREE.Vector3(-hw,  hh, 0),
            new THREE.Vector3(  0,   0, 0)
          ];

          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          corners.forEach(c => {
            c.applyMatrix4(mesh.matrixWorld).project(camera);
            if (c.x < minX) minX = c.x;
            if (c.x > maxX) maxX = c.x;
            if (c.y < minY) minY = c.y;
            if (c.y > maxY) maxY = c.y;
          });

          return (
            ndcX >= minX - pad && ndcX <= maxX + pad &&
            ndcY >= minY - pad && ndcY <= maxY + pad
          );
        }

        function executeNavigation(targetUrl) {
          const finalUrl = normalizeUrl(targetUrl) || defaultRedirectUrl;
          if (!finalUrl || isNavigating) return;
          isNavigating = true;

          hud.style.background = "rgba(0, 122, 255, 0.95)";
          hud.innerHTML = "🔗 正在前往連結...";

          setTimeout(() => { isNavigating = false; }, 1200);
          window.location.assign(finalUrl);
        }

        function handleScreenTap(clientX, clientY) {
          // 允許目前鎖定中，或點擊瞬間因微震剛脫鎖 2.5 秒內的點擊
          const recentlyLocked = (performance.now() - lastLockedTime) < 2500;
          if (!isTargetLocked && !recentlyLocked) return;

          // 1. 若因手指點擊微震短暫脫鎖，暫時還原最後一次鎖定的矩陣供碰撞計算
          if (!isTargetLocked && recentlyLocked) {
            anchor.group.matrix.copy(lastValidAnchorMatrix);
          }

          // 2. 【核心修復】：強制更新相機逆投影矩陣與錨點世界座標矩陣
          scene.updateMatrixWorld(true);
          anchor.group.updateMatrixWorld(true);
          camera.updateMatrixWorld(true);
          camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
          camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

          // 3. 【核心修復】：以畫布真實邊界 (getBoundingClientRect) 計算點擊座標
          const rect = renderer.domElement.getBoundingClientRect();
          if (rect.width === 0 || rect.height === 0) return;

          const ndcX = ((clientX - rect.left) / rect.width) * 2 - 1;
          const ndcY = -((clientY - rect.top) / rect.height) * 2 + 1;

          pointer.set(ndcX, ndcY);
          raycaster.setFromCamera(pointer, camera);

          // ---------------------------------------------------------
          // 第一優先：檢查圖片上的透明點位 (3D Raycaster + 2D 投影距離)
          // ---------------------------------------------------------
          if (hotspotClickables.length > 0) {
            const hsHits = raycaster.intersectObjects(hotspotClickables, true);
            if (hsHits.length > 0) {
              executeNavigation(hsHits[0].object.userData?.targetUrl);
              return;
            }

            // 2D 螢幕投影檢查：找出距離手指點擊處最近的透明點位
            let closestHs = null;
            let minScreenDist = 0.22;
            hotspotClickables.forEach(hsMesh => {
              const center = new THREE.Vector3(0, 0, 0).applyMatrix4(hsMesh.matrixWorld).project(camera);
              const dist = Math.hypot(ndcX - center.x, ndcY - center.y);
              if (dist < minScreenDist) {
                minScreenDist = dist;
                closestHs = hsMesh;
              }
            });
            if (closestHs) {
              executeNavigation(closestHs.userData?.targetUrl);
              return;
            }
          }

          // ---------------------------------------------------------
          // 第二優先：若點中互動圖片平面，透過 UV 座標比對點位或跳轉預設網址
          // ---------------------------------------------------------
          if (interactiveImageMesh) {
            const imgHits = raycaster.intersectObject(interactiveImageMesh, true);
            if (imgHits.length > 0 && imgHits[0].uv) {
              const u = imgHits[0].uv.x;
              const v = 1.0 - imgHits[0].uv.y;

              let bestSpotUrl = null;
              let minUvDist = 0.20;
              const hotspots = (validImageLayer && Array.isArray(validImageLayer.hotspots)) ? validImageLayer.hotspots : [];
              hotspots.forEach(spot => {
                const d = Math.hypot(u - Number(spot.uvX ?? 0.5), v - Number(spot.uvY ?? 0.5));
                if (d < minUvDist) {
                  minUvDist = d;
                  bestSpotUrl = normalizeUrl(spot.url) || defaultRedirectUrl;
                }
              });

              executeNavigation(bestSpotUrl || defaultRedirectUrl);
              return;
            }
          }

          // ---------------------------------------------------------
          // 第三優先：檢查影片與浮空文字框 (3D Raycaster + 2D 投影矩形保底)
          // ---------------------------------------------------------
          const generalHits = raycaster.intersectObjects(generalClickables, true);
          if (generalHits.length > 0) {
            executeNavigation(generalHits[0].object.userData?.targetUrl);
            return;
          }

          for (let i = 0; i < generalClickables.length; i++) {
            const mesh = generalClickables[i];
            if (isPointInProjectedMesh(mesh, ndcX, ndcY, 0.08)) {
              executeNavigation(mesh.userData?.targetUrl);
              return;
            }
          }
        }

        // 支援手機觸控與滑鼠點擊
        let downX = 0, downY = 0;
        window.addEventListener('pointerdown', (e) => {
          downX = e.clientX;
          downY = e.clientY;
        }, { passive: true });

        window.addEventListener('pointerup', (e) => {
          if (overlay.style.display !== 'none') return;
          if (Math.hypot(e.clientX - downX, e.clientY - downY) < 35) {
            handleScreenTap(e.clientX, e.clientY);
          }
        });

        window.addEventListener('click', (e) => {
          if (overlay.style.display !== 'none') return;
          handleScreenTap(e.clientX, e.clientY);
        });

      } catch (err) {
        console.error(err);
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerText = `相機或 AR 啟動失敗：\n${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
