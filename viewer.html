<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 觀看端</title>

  <!-- 1. 完整官方模組映射 (補齊 three/addons/ 解決手機卡載入問題，並確保 THREE 100% 同源) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 2. 嚴格遵照 MindAR 原生容器設定，不覆寫 canvas/video 的 top/left/width/height */
    #ar-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
    }

    /* 僅指定圖層順序：鏡頭在 1，3D 畫布在 2，保留 MindAR 計算出的精準座標對位 */
    #ar-container video {
      z-index: 1 !important;
    }
    #ar-container canvas {
      z-index: 2 !important;
    }

    /* 隱藏預載影片池 (維持在 DOM 內供 iOS 硬體解碼) */
    #video-preload-pool {
      position: fixed; bottom: 0; right: 0;
      width: 1px; height: 1px; opacity: 0.01;
      pointer-events: none; z-index: -1;
    }

    /* 頂部追蹤狀態燈 */
    #tracker-hud {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 1000; padding: 8px 18px; border-radius: 20px;
      font-size: 14px; font-weight: bold; color: white;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      display: none; pointer-events: none; white-space: nowrap;
    }

    /* 左下角即時診斷小面板 */
    #debug-panel {
      position: fixed; bottom: 10px; left: 10px;
      z-index: 1000; padding: 8px 12px; border-radius: 8px;
      font-size: 11px; line-height: 1.4; color: #00ffcc;
      background: rgba(0, 0, 0, 0.7); pointer-events: none;
      max-width: 90vw; white-space: pre-wrap; display: none;
    }

    /* 啟動遮罩 */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 2000; color: white;
      text-align: center; padding: 20px;
    }

    #start-btn {
      padding: 15px 36px; font-size: 18px; border: none; border-radius: 30px;
      background: #007aff; color: white; cursor: pointer; font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
    }
    #start-btn:disabled { background: #555; box-shadow: none; }

    #status-msg {
      margin-top: 15px; font-size: 14px; line-height: 1.5;
      white-space: pre-wrap; max-width: 90%; color: #94a3b8;
    }
    .text-error { color: #ff4d4f !important; font-weight: bold; }
  </style>
</head>
<body>

  <div id="tracker-hud">🟡 正在尋找目標圖卡...</div>
  <div id="debug-panel">初始化中...</div>

  <div id="overlay">
    <h2>WebAR 互動體驗</h2>
    <button id="start-btn" disabled>連線中...</button>
    <div id="status-msg">正在檢查環境與載入設定檔...</div>
  </div>

  <div id="ar-container"></div>
  <div id="video-preload-pool"></div>

  <!-- 使用一般 script 搭配動態 import()，任何載入錯誤皆可被攔截顯示，絕不卡死 -->
  <script>
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const statusMsg = document.getElementById('status-msg');
    const hud = document.getElementById('tracker-hud');
    const debugPanel = document.getElementById('debug-panel');
    const preloadPool = document.getElementById('video-preload-pool');

    let THREE = null;
    let MindARThree = null;
    let config = null;
    const validVideoItems = []; // 儲存真正存在於 GitHub 的影片項目

    function checkInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf('Line') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1) {
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerHTML = "⚠️ <b>無法在通訊軟體內建瀏覽器中開啟</b><br><br>請點選右上角選單：<br>👉 選擇<b>「以 Safari / Chrome 開啟」</b>。";
        return true;
      }
      return false;
    }

    // 檢查遠端影片是否真的存在 (過濾掉未上傳的 404 預設路徑)
    async function checkVideoExists(url) {
      if (!url) return false;
      try {
        const res = await fetch(`${url}?t=${Date.now()}`, { method: 'HEAD' });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    async function init() {
      if (checkInAppBrowser()) return;

      try {
        // 1. 讀取 config.json
        statusMsg.innerText = "⏳ 1/3 正在讀取 config.json 設定檔...";
        const res = await fetch(`./config.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`找不到 config.json (HTTP ${res.status})`);
        config = await res.json();

        // 2. 載入同源 Three.js 與 MindAR 1.2.5 核心
        statusMsg.innerText = "⏳ 2/3 正在載入 3D 與 AR 核心引擎...";
        THREE = await import('three');
        const mindarModule = await import('mindar-image-three');
        MindARThree = mindarModule.MindARThree;

        // 關閉新版 Three.js 色彩空間自動轉換，確保去背色碼與後台預覽 100% 一致
        if (THREE.ColorManagement) {
          THREE.ColorManagement.enabled = false;
        }

        // 3. 檢查並預先建立真正存在的影片標籤
        statusMsg.innerText = "⏳ 3/3 正在檢查已發布的影片資產...";
        if (config.videos && Array.isArray(config.videos)) {
          for (let i = 0; i < config.videos.length; i++) {
            const vConf = config.videos[i];
            const exists = await checkVideoExists(vConf.url);
            if (exists) {
              const v = document.createElement('video');
              v.src = `${vConf.url}?t=${Date.now()}`;
              v.loop = true;
              v.muted = true;
              v.playsInline = true;
              v.setAttribute('playsinline', '');
              v.setAttribute('webkit-playsinline', '');
              v.setAttribute('preload', 'auto');
              v.crossOrigin = "anonymous";
              preloadPool.appendChild(v);
              v.load();
              validVideoItems.push({ index: i + 1, element: v, config: vConf });
            }
          }
        }

        statusMsg.innerText = `✅ 準備就緒（偵測到 ${validVideoItems.length} 支有效影片）\n請將鏡頭對準實體圖卡`;
        startBtn.innerText = "點擊啟動 AR 鏡頭";
        startBtn.disabled = false;
        startBtn.onclick = startAR;

      } catch (err) {
        console.error(err);
        statusMsg.className = 'text-error';
        statusMsg.innerText = `初始化失敗：\n${err.message}`;
        startBtn.innerText = "載入失敗";
      }
    }

    async function startAR() {
      startBtn.disabled = true;
      startBtn.innerText = "相機啟動中...";

      // 【關鍵修復】：在使用者點擊按鈕的「第一時間同步區段」喚醒所有影片，100% 取得手機播放授權
      validVideoItems.forEach(item => {
        item.element.play().catch(e => console.warn(`影片 ${item.index} 初始喚醒:`, e));
      });

      try {
        const container = document.querySelector("#ar-container");

        const mindarThree = new MindARThree({
          container: container,
          imageTargetSrc: `./targets.mind?t=${Date.now()}`,
          uiLoading: "no",
          uiScanning: "no"
        });

        const { renderer, scene, camera } = mindarThree;
        renderer.setClearColor(0x000000, 0);

        const anchor = mindarThree.addAnchor(0);
        const clickables = [];

        // ==========================================
        // A. 建立圖卡對位青色外框 (1x1 標準尺寸)
        // ==========================================
        const borderGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1));
        const borderMat = new THREE.LineBasicMaterial({ color: 0x00ffff });
        const borderLine = new THREE.LineSegments(borderGeo, borderMat);
        borderLine.position.set(0, 0, 0.01);
        anchor.group.add(borderLine);

        // ==========================================
        // B. 建立 3D 浮空文字看板 (關閉深度遮擋，確保永遠在最上層可見)
        // ==========================================
        const cvs = document.createElement('canvas');
        cvs.width = 1024;
        cvs.height = 256;
        const ctx = cvs.getContext('2d');

        // 繪製深藍底色與亮藍邊框
        ctx.fillStyle = "rgba(10, 15, 30, 0.92)";
        ctx.fillRect(10, 10, 1004, 236);
        ctx.lineWidth = 12;
        ctx.strokeStyle = "#007aff";
        ctx.strokeRect(10, 10, 1004, 236);

        // 繪製文字
        ctx.font = "bold 50px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(config.bannerText || "👉 點擊任意影片前往官方網站！", 512, 128);

        const bannerTexture = new THREE.CanvasTexture(cvs);
        bannerTexture.needsUpdate = true;

        const bannerMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1.3, 0.32),
          new THREE.MeshBasicMaterial({
            map: bannerTexture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        // 讀取後台設定高度，預設 0.65 (緊鄰圖卡上緣)
        const bannerY = (config.bannerPosY !== undefined) ? Number(config.bannerPosY) : 0.65;
        bannerMesh.position.set(0, bannerY, 0.06);
        bannerMesh.renderOrder = 10;
        anchor.group.add(bannerMesh);
        clickables.push(bannerMesh);

        // ==========================================
        // C. 建立去背影片平面 (僅針對實際存在的影片建立)
        // ==========================================
        const vShader = `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `;
        const fShader = `
          uniform sampler2D textureMap;
          uniform vec3 keyColor;
          uniform float similarity;
          uniform float smoothness;
          varying vec2 vUv;
          void main() {
            vec4 col = texture2D(textureMap, vUv);
            float diff = length(col.rgb - keyColor);
            float alpha = smoothstep(similarity, similarity + smoothness, diff);
            gl_FragColor = vec4(col.rgb, col.a * alpha);
          }
        `;

        const activeVideoTextures = [];

        validVideoItems.forEach((item, idx) => {
          const v = item.element;
          const vConfig = item.config;

          const vTexture = new THREE.VideoTexture(v);
          vTexture.minFilter = THREE.LinearFilter;
          vTexture.magFilter = THREE.LinearFilter;
          activeVideoTextures.push({ texture: vTexture, video: v, id: item.index });

          const mat = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: vTexture },
              keyColor: { value: new THREE.Color(vConfig.keyColor || "#00ff00") },
              similarity: { value: Number(vConfig.similarity ?? 0.4) },
              smoothness: { value: Number(vConfig.smoothness ?? 0.1) }
            },
            vertexShader: vShader,
            fragmentShader: fShader,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false // 關鍵：防止透明區域遮擋其他 3D 物件
          });

          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.45), mat);
          mesh.position.set(Number(vConfig.px || 0), Number(vConfig.py || 0), 0.04 + idx * 0.01);
          mesh.rotation.y = THREE.MathUtils.degToRad(Number(vConfig.ry || 0));
          mesh.rotation.z = THREE.MathUtils.degToRad(Number(vConfig.rz || 0));
          mesh.renderOrder = 5 + idx;

          anchor.group.add(mesh);
          clickables.push(mesh);
        });

        // ==========================================
        // D. 綁定目標鎖定與遺失事件
        // ==========================================
        let isTargetLocked = false;
        anchor.onTargetFound = () => {
          isTargetLocked = true;
          hud.style.background = "rgba(40, 167, 69, 0.9)";
          hud.innerHTML = "🟢 目標已鎖定！";
          validVideoItems.forEach(item => {
            if (item.element.paused) item.element.play().catch(() => {});
          });
        };

        anchor.onTargetLost = () => {
          isTargetLocked = false;
          hud.style.background = "rgba(0, 0, 0, 0.75)";
          hud.innerHTML = "🟡 正在尋找目標圖卡...";
        };

        // 啟動 MindAR
        await mindarThree.start();

        overlay.style.display = 'none';
        hud.style.display = 'block';
        debugPanel.style.display = 'block';

        // ==========================================
        // E. 渲染迴圈與即時診斷資訊更新
        // ==========================================
        renderer.setAnimationLoop(() => {
          let vStatusText = "";
          activeVideoTextures.forEach(vt => {
            if (vt.video.readyState >= vt.video.HAVE_CURRENT_DATA) {
              vt.texture.needsUpdate = true;
            }
            vStatusText += `影片${vt.id}: ${vt.video.paused ? '暫停' : '播放中'} (${vt.video.videoWidth}x${vt.video.videoHeight})\n`;
          });

          debugPanel.innerText =
            `[診斷面板] 追蹤狀態: ${isTargetLocked ? '已鎖定' : '搜尋中'}\n` +
            `錨點子物件數: ${anchor.group.children.length} (含外框+看板+${activeVideoTextures.length}支影片)\n` +
            `看板座標 Y: ${bannerY}\n` +
            (vStatusText || "無有效影片檔案");

          renderer.render(scene, camera);
        });

        // ==========================================
        // F. 點擊跳轉判定 (支援手機觸控 touchstart 與 click)
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function handleInteract(clientX, clientY) {
          if (!isTargetLocked) return;
          pointer.x = (clientX / window.innerWidth) * 2 - 1;
          pointer.y = -(clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const intersects = raycaster.intersectObjects(clickables, false);
          if (intersects.length > 0 && config.redirectUrl) {
            window.location.href = config.redirectUrl;
          }
        }

        window.addEventListener('click', (e) => handleInteract(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) {
            handleInteract(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });

      } catch (err) {
        console.error(err);
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerText = `相機或 AR 啟動失敗：\n${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
