<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- 防快取標籤 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR 觀看端</title>

  <!-- 官方同源模組映射 (Three.js r160 + MindAR 1.2.5) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #ar-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
    }

    #ar-container video { z-index: 1 !important; }
    #ar-container canvas { z-index: 2 !important; }

    /* 隱藏預載影片池 */
    #video-preload-pool {
      position: fixed; bottom: 0; right: 0;
      width: 1px; height: 1px; opacity: 0.01;
      pointer-events: none; z-index: -1;
    }

    /* 頂部簡潔追蹤狀態燈 */
    #tracker-hud {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 1000; padding: 8px 18px; border-radius: 20px;
      font-size: 14px; font-weight: bold; color: white;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      display: none; pointer-events: none; white-space: nowrap;
    }

    /* 啟動遮罩 */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 2000; color: white;
      text-align: center; padding: 20px;
    }

    #start-btn {
      padding: 15px 36px; font-size: 18px; border: none; border-radius: 30px;
      background: #007aff; color: white; cursor: pointer; font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
    }
    #start-btn:disabled { background: #555; box-shadow: none; }

    #status-msg {
      margin-top: 15px; font-size: 14px; line-height: 1.5;
      white-space: pre-wrap; max-width: 90%; color: #94a3b8;
    }
    .text-error { color: #ff4d4f !important; font-weight: bold; }
  </style>
</head>
<body>

  <div id="tracker-hud">🟡 正在尋找目標圖卡...</div>

  <div id="overlay">
    <h2>WebAR 互動體驗</h2>
    <button id="start-btn" disabled>連線中...</button>
    <div id="status-msg">正在檢查環境與載入設定檔...</div>
  </div>

  <div id="ar-container"></div>
  <div id="video-preload-pool"></div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const statusMsg = document.getElementById('status-msg');
    const hud = document.getElementById('tracker-hud');
    const preloadPool = document.getElementById('video-preload-pool');

    let THREE = null;
    let MindARThree = null;
    let config = null;
    const validVideoItems = [];
    let validImageLayer = null;

    function checkInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf('Line') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1) {
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerHTML = "⚠️ <b>無法在通訊軟體內建瀏覽器中開啟</b><br><br>請點選右上角選單：<br>👉 選擇<b>「以 Safari / Chrome 開啟」</b>。";
        return true;
      }
      return false;
    }

    async function checkAssetExists(url) {
      if (!url) return false;
      try {
        const res = await fetch(`${url}?t=${Date.now()}`, { method: 'HEAD' });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    // 繪製原版簡潔圓角浮空文字框
    function createCleanBannerTexture(text) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 256;
      const ctx = cvs.getContext('2d');

      ctx.fillStyle = "rgba(10, 10, 10, 0.85)";
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(20, 20, 984, 216, 40);
      } else {
        ctx.rect(20, 20, 984, 216);
      }
      ctx.fill();

      ctx.lineWidth = 8;
      ctx.strokeStyle = "#007aff";
      ctx.stroke();

      ctx.font = "bold 50px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text || "👉 點擊任意影片前往官方網站！", 512, 128);

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // 繪製圖片上的互動點位標記紋理 (編號圓點 + 選填文字標籤)
    function createHotspotTexture(index, labelText) {
      const cvs = document.createElement('canvas');
      cvs.width = 256;
      cvs.height = 256;
      const ctx = cvs.getContext('2d');
      const cx = 128, cy = 128;

      // 外圈半透明白光環
      ctx.beginPath();
      ctx.arc(cx, cy, 68, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(0, 122, 255, 0.35)";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      // 內圈實心藍底圓鈕
      ctx.beginPath();
      ctx.arc(cx, cy, 46, 0, Math.PI * 2);
      ctx.fillStyle = "#007aff";
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      // 點位編號或點擊圖示
      ctx.font = "bold 44px -apple-system, sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(index), cx, cy + 2);

      // 若有設定點位名稱，於下方繪製小標籤
      if (labelText && labelText.trim() !== "") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(16, 202, 224, 44);
        ctx.strokeStyle = "#007aff";
        ctx.lineWidth = 3;
        ctx.strokeRect(16, 202, 224, 44);
        ctx.font = "bold 26px -apple-system, sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(labelText.trim().slice(0, 7), cx, 224);
      }

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    async function init() {
      if (checkInAppBrowser()) return;

      try {
        statusMsg.innerText = "⏳ 1/3 正在讀取 config.json 設定檔...";
        const res = await fetch(`./config.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`找不到 config.json (HTTP ${res.status})`);
        config = await res.json();

        statusMsg.innerText = "⏳ 2/3 正在載入 3D 與 AR 核心引擎...";
        THREE = await import('three');
        const mindarModule = await import('mindar-image-three');
        MindARThree = mindarModule.MindARThree;

        if (THREE.ColorManagement) {
          THREE.ColorManagement.enabled = false;
        }

        statusMsg.innerText = "⏳ 3/3 正在檢查已發布的媒體資產...";
        // 檢查影片資產
        if (config.videos && Array.isArray(config.videos)) {
          for (let i = 0; i < config.videos.length; i++) {
            const vConf = config.videos[i];
            const exists = await checkAssetExists(vConf.url);
            if (exists) {
              const v = document.createElement('video');
              v.src = `${vConf.url}?t=${Date.now()}`;
              v.loop = true;
              v.muted = true;
              v.playsInline = true;
              v.setAttribute('loop', '');
              v.setAttribute('muted', '');
              v.setAttribute('playsinline', '');
              v.setAttribute('webkit-playsinline', '');
              v.setAttribute('preload', 'auto');
              v.crossOrigin = "anonymous";

              v.addEventListener('ended', () => {
                v.currentTime = 0;
                v.play().catch(() => {});
              });

              preloadPool.appendChild(v);
              v.load();
              validVideoItems.push({ index: i + 1, element: v, config: vConf });
            }
          }
        }

        // 檢查新增的 AR 圖片資產
        if (config.imageLayer && config.imageLayer.enabled && config.imageLayer.url) {
          const imgExists = await checkAssetExists(config.imageLayer.url);
          if (imgExists) {
            validImageLayer = config.imageLayer;
          }
        }

        const imgInfo = validImageLayer ? ` + 1 張互動圖片(${(validImageLayer.hotspots || []).length}個點位)` : "";
        statusMsg.innerText = `✅ 準備就緒（偵測到 ${validVideoItems.length} 支影片${imgInfo}）\n請將鏡頭對準實體圖卡`;
        startBtn.innerText = "點擊啟動 AR 鏡頭";
        startBtn.disabled = false;
        startBtn.onclick = startAR;

      } catch (err) {
        console.error(err);
        statusMsg.className = 'text-error';
        statusMsg.innerText = `初始化失敗：\n${err.message}`;
        startBtn.innerText = "載入失敗";
      }
    }

    async function startAR() {
      startBtn.disabled = true;
      startBtn.innerText = "相機啟動中...";

      validVideoItems.forEach(item => {
        item.element.play().catch(e => console.warn(`影片 ${item.index} 初始喚醒:`, e));
      });

      try {
        const container = document.querySelector("#ar-container");

        const mindarThree = new MindARThree({
          container: container,
          imageTargetSrc: `./targets.mind?t=${Date.now()}`,
          uiLoading: "no",
          uiScanning: "no",
          filterMinCF: 0.001,
          filterBeta: 0.01,
          missTolerance: 5,
          warmupTolerance: 2
        });

        const { renderer, scene, camera } = mindarThree;
        renderer.setClearColor(0x000000, 0);

        const anchor = mindarThree.addAnchor(0);
        const clickables = [];
        const pulseHotspots = [];

        // =========================================================
        // A. 簡潔浮空文字看板
        // =========================================================
        const bannerTexture = createCleanBannerTexture(config.bannerText);
        const bannerMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1.3, 0.32),
          new THREE.MeshBasicMaterial({
            map: bannerTexture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        const baseBannerY = (config.bannerPosY !== undefined) ? Number(config.bannerPosY) : 0.65;
        bannerMesh.position.set(0, baseBannerY, 0.12);
        bannerMesh.renderOrder = 20;
        bannerMesh.userData = { targetUrl: config.redirectUrl, isHotspot: false };
        anchor.group.add(bannerMesh);
        clickables.push(bannerMesh);

        // =========================================================
        // B. 純淨去背影片平面
        // =========================================================
        const vShader = `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `;
        const fShader = `
          uniform sampler2D textureMap;
          uniform vec3 keyColor;
          uniform float similarity;
          uniform float smoothness;
          varying vec2 vUv;

          void main() {
            vec4 col = texture2D(textureMap, vUv);
            float diff = length(col.rgb - keyColor);
            float alpha = smoothstep(similarity, similarity + smoothness, diff);
            gl_FragColor = vec4(col.rgb, col.a * alpha);
          }
        `;

        const activeVideoObjects = [];
        const basePlaneHeight = 0.55;

        validVideoItems.forEach((item, idx) => {
          const v = item.element;
          const vConfig = item.config;

          const vTexture = new THREE.VideoTexture(v);
          vTexture.minFilter = THREE.LinearFilter;
          vTexture.magFilter = THREE.LinearFilter;

          const mat = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: vTexture },
              keyColor: { value: new THREE.Color(vConfig.keyColor || "#00ff00") },
              similarity: { value: Number(vConfig.similarity ?? 0.4) },
              smoothness: { value: Number(vConfig.smoothness ?? 0.1) }
            },
            vertexShader: vShader,
            fragmentShader: fShader,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(basePlaneHeight, basePlaneHeight), mat);

          const baseX = Number(vConfig.px || 0);
          const baseY = Number(vConfig.py || 0);
          const baseZ = 0.15 + idx * 0.02;
          const baseRY = THREE.MathUtils.degToRad(Number(vConfig.ry || 0));
          const baseRZ = THREE.MathUtils.degToRad(Number(vConfig.rz || 0));

          mesh.position.set(baseX, baseY, baseZ);
          mesh.rotation.set(0, baseRY, baseRZ);
          mesh.renderOrder = 10 + idx;
          mesh.userData = { targetUrl: vConfig.linkUrl || config.redirectUrl, isHotspot: false };

          anchor.group.add(mesh);
          clickables.push(mesh);

          activeVideoObjects.push({
            video: v,
            texture: vTexture,
            mesh: mesh,
            aspectCalibrated: false
          });
        });

        // =========================================================
        // C. 新增：AR 圖片圖層與多點位互動熱點 (Hotspots)
        // =========================================================
        if (validImageLayer) {
          const imgGroup = new THREE.Group();
          const imgX = Number(validImageLayer.px || 0);
          const imgY = Number(validImageLayer.py || 0);
          const imgZ = Number(validImageLayer.pz ?? 0.10);
          const imgRY = THREE.MathUtils.degToRad(Number(validImageLayer.ry || 0));
          const imgRZ = THREE.MathUtils.degToRad(Number(validImageLayer.rz || 0));
          const imgScale = Number(validImageLayer.scale || 1.0);

          imgGroup.position.set(imgX, imgY, imgZ);
          imgGroup.rotation.set(0, imgRY, imgRZ);
          anchor.group.add(imgGroup);

          const texLoader = new THREE.TextureLoader();
          texLoader.setCrossOrigin("anonymous");
          texLoader.load(`${validImageLayer.url}?t=${Date.now()}`, (imgTex) => {
            const imgW = imgTex.image.width || 1;
            const imgH = imgTex.image.height || 1;
            const aspect = imgW / imgH;

            const planeH = 0.65 * imgScale;
            const planeW = planeH * aspect;

            const imgMat = new THREE.MeshBasicMaterial({
              map: imgTex,
              transparent: true,
              side: THREE.DoubleSide,
              depthWrite: false
            });
            const imgMesh = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), imgMat);
            imgMesh.renderOrder = 15;
            imgGroup.add(imgMesh);

            // 依據設定的點位 (uvX, uvY) 在圖片表面建立可點擊標記
            const hotspots = Array.isArray(validImageLayer.hotspots) ? validImageLayer.hotspots : [];
            hotspots.forEach((spot, sIdx) => {
              if (!spot.url) return;

              const uvX = Number(spot.uvX ?? 0.5);
              const uvY = Number(spot.uvY ?? 0.5);

              // 將 0~1 的圖片點擊座標轉換為 3D 平面相對座標
              const localX = (uvX - 0.5) * planeW;
              const localY = (0.5 - uvY) * planeH;

              const hsTex = createHotspotTexture(sIdx + 1, spot.label || "");
              const hsMat = new THREE.MeshBasicMaterial({
                map: hsTex,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false
              });

              const markerSize = Math.max(0.11, 0.12 * imgScale);
              const hsMesh = new THREE.Mesh(new THREE.PlaneGeometry(markerSize, markerSize), hsMat);
              hsMesh.position.set(localX, localY, 0.015); // 浮於圖片表面正前方
              hsMesh.renderOrder = 25 + sIdx;
              hsMesh.userData = {
                targetUrl: spot.url,
                isHotspot: true,
                label: spot.label || `點位 ${sIdx + 1}`
              };

              imgGroup.add(hsMesh);
              clickables.push(hsMesh);
              pulseHotspots.push(hsMesh);
            });
          });
        }

        // =========================================================
        // D. 追蹤狀態事件
        // =========================================================
        let isTargetLocked = false;

        anchor.onTargetFound = () => {
          isTargetLocked = true;
          hud.style.background = "rgba(40, 167, 69, 0.9)";
          hud.innerHTML = "🟢 目標已鎖定！";
          validVideoItems.forEach(item => {
            if (item.element.paused) item.element.play().catch(() => {});
          });
        };

        anchor.onTargetLost = () => {
          isTargetLocked = false;
          hud.style.background = "rgba(0, 0, 0, 0.75)";
          hud.innerHTML = "🟡 正在尋找目標圖卡...";
        };

        await mindarThree.start();

        overlay.style.display = 'none';
        hud.style.display = 'block';

        // =========================================================
        // E. 螢幕旋轉即時校正處理
        // =========================================================
        window.addEventListener('resize', () => {
          const width = window.innerWidth;
          const height = window.innerHeight;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        });

        // =========================================================
        // F. 渲染迴圈：無限循環巡檢、紋理更新與點位微幅呼吸提示
        // =========================================================
        const clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
          const elapsed = clock.getElapsedTime();

          activeVideoObjects.forEach(vo => {
            const v = vo.video;

            if (isTargetLocked) {
              if (v.duration > 0 && v.currentTime >= v.duration - 0.05) {
                v.currentTime = 0;
                v.play().catch(() => {});
              } else if (v.paused || v.ended) {
                if (v.ended) v.currentTime = 0;
                v.play().catch(() => {});
              }
            }

            if (v.readyState >= v.HAVE_CURRENT_DATA) {
              vo.texture.needsUpdate = true;

              if (!vo.aspectCalibrated && v.videoWidth > 0 && v.videoHeight > 0) {
                const aspect = v.videoWidth / v.videoHeight;
                vo.mesh.scale.set(aspect, 1, 1);
                vo.aspectCalibrated = true;
              }
            }
          });

          // 讓圖片上的點位標記有輕微的原地縮放提示 (位置絕對固定不移動)
          pulseHotspots.forEach((hs, idx) => {
            const s = 1.0 + Math.sin(elapsed * 4.0 + idx) * 0.08;
            hs.scale.set(s, s, 1);
          });

          renderer.render(scene, camera);
        });

        // =========================================================
        // G. 點擊與觸控跳轉判定 (優先觸發圖片點位專屬連結)
        // =========================================================
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let lastNavigateTime = 0;

        function handleInteract(clientX, clientY) {
          if (!isTargetLocked) return;
          if (Date.now() - lastNavigateTime < 800) return; // 防止連點重複觸發

          pointer.x = (clientX / window.innerWidth) * 2 - 1;
          pointer.y = -(clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);

          const intersects = raycaster.intersectObjects(clickables, false);
          if (intersects.length > 0) {
            // 優先檢查是否點中「圖片上的特定點位 (isHotspot)」
            const hotspotHit = intersects.find(hit => hit.object.userData && hit.object.userData.isHotspot);
            const chosenHit = hotspotHit || intersects[0];
            const targetUrl = chosenHit.object.userData?.targetUrl || config.redirectUrl;

            if (targetUrl) {
              lastNavigateTime = Date.now();
              const newWin = window.open(targetUrl, '_blank');
              if (!newWin) {
                window.location.href = targetUrl;
              }
            }
          }
        }

        window.addEventListener('click', (e) => handleInteract(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) {
            handleInteract(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });

      } catch (err) {
        console.error(err);
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerText = `相機或 AR 啟動失敗：\n${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
