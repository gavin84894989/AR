<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 觀看端 - 怪化貓浮世繪卷</title>

  <!-- 1. 官方模組映射 (THREE 與 MindAR 1.2.5 同源) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent !important;
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "DFKai-SB", serif;
    }

    #ar-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
    }

    #ar-container video { z-index: 1 !important; }
    #ar-container canvas { z-index: 2 !important; }

    /* 隱藏預載影片池 */
    #video-preload-pool {
      position: fixed; bottom: 0; right: 0;
      width: 1px; height: 1px; opacity: 0.01;
      pointer-events: none; z-index: -1;
    }

    /* 頂部怪化貓御札風格 HUD 狀態燈 */
    #tracker-hud {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 1000; padding: 8px 24px;
      font-size: 14px; font-weight: 900; letter-spacing: 2px; color: #fef08a;
      background: linear-gradient(90deg, rgba(46, 16, 101, 0.92), rgba(136, 19, 55, 0.92), rgba(46, 16, 101, 0.92));
      border: 2px solid #fbbf24;
      outline: 2px solid #e11d48;
      outline-offset: -5px;
      box-shadow: 0 4px 18px rgba(225, 29, 72, 0.55);
      display: none; pointer-events: none; white-space: nowrap;
    }

    /* 左下角即時診斷面板 */
    #debug-panel {
      position: fixed; bottom: 10px; left: 10px;
      z-index: 1000; padding: 8px 12px;
      font-size: 11px; line-height: 1.4; color: #fde047;
      background: rgba(20, 10, 30, 0.8);
      border-left: 3px solid #e11d48;
      border-right: 1px solid #fbbf24;
      font-family: monospace;
      pointer-events: none; max-width: 90vw; white-space: pre-wrap; display: none;
    }

    /* 怪化貓浮世繪和紙啟動遮罩 */
    #overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background:
        radial-gradient(circle at 50% 35%, rgba(159, 18, 57, 0.45) 0%, rgba(30, 27, 75, 0.92) 60%, #090514 100%);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 2000; color: #fef08a;
      text-align: center; padding: 24px;
      border: 6px double #fbbf24;
    }

    #overlay h2 {
      font-size: 24px; letter-spacing: 4px; color: #fef08a;
      text-shadow: 0 2px 0 #e11d48, 0 0 18px rgba(251, 191, 36, 0.7);
      margin-bottom: 8px;
    }

    #overlay .sub-title {
      font-size: 13px; letter-spacing: 6px; color: #fda4af; margin-bottom: 28px;
    }

    #start-btn {
      padding: 15px 38px; font-size: 18px; font-family: inherit;
      border: 2px solid #fbbf24;
      background: linear-gradient(135deg, #9f1239 0%, #be123c 50%, #701a75 100%);
      color: #fef08a; cursor: pointer; font-weight: 900; letter-spacing: 3px;
      box-shadow: 0 0 22px rgba(225, 29, 72, 0.6), inset 0 0 10px rgba(251, 191, 36, 0.4);
      transition: all 0.25s;
    }
    #start-btn:disabled {
      border-color: #64748b; color: #94a3b8; background: #1e293b;
      box-shadow: none;
    }

    #status-msg {
      margin-top: 18px; font-size: 13px; line-height: 1.6;
      white-space: pre-wrap; max-width: 90%; color: #fde68a;
    }
    .text-error { color: #ff4d4f !important; font-weight: bold; }
  </style>
</head>
<body>

  <div id="tracker-hud">【 尋覓：形・真・理 // 請對準繪卷圖卡 】</div>
  <div id="debug-panel">SYS.INIT...</div>

  <div id="overlay">
    <h2>◈ 浮世繪實境・百鬼御札 ◈</h2>
    <div class="sub-title">― 形・真・理 ―</div>
    <button id="start-btn" disabled>結界準備中...</button>
    <div id="status-msg">正在檢視環境與載入設定檔...</div>
  </div>

  <div id="ar-container"></div>
  <div id="video-preload-pool"></div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const statusMsg = document.getElementById('status-msg');
    const hud = document.getElementById('tracker-hud');
    const debugPanel = document.getElementById('debug-panel');
    const preloadPool = document.getElementById('video-preload-pool');

    let THREE = null;
    let MindARThree = null;
    let config = null;
    const validVideoItems = [];

    function checkInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf('Line') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1) {
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerHTML = "⚠️ <b>無法在通訊軟體內建瀏覽器中開啟</b><br><br>請點選右上角選單：<br>👉 選擇<b>「以 Safari / Chrome 開啟」</b>。";
        return true;
      }
      return false;
    }

    async function checkVideoExists(url) {
      if (!url) return false;
      try {
        const res = await fetch(`${url}?t=${Date.now()}`, { method: 'HEAD' });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    // =========================================================
    // 怪化貓視覺工具 1：繪製「御札・浮世繪和紙金箔」浮空文字框
    // =========================================================
    function createMononokeBannerTexture(text) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 300;
      const ctx = cvs.getContext('2d');

      const x = 24, y = 24, w = 976, h = 252;
      const notch = 28; // 傳統隅切角尺寸

      function drawOfudaPath(inset = 0) {
        const ix = x + inset, iy = y + inset, iw = w - inset * 2, ih = h - inset * 2;
        ctx.beginPath();
        ctx.moveTo(ix + notch, iy);
        ctx.lineTo(ix + iw - notch, iy);
        ctx.lineTo(ix + iw, iy + notch);
        ctx.lineTo(ix + iw, iy + ih - notch);
        ctx.lineTo(ix + iw - notch, iy + ih);
        ctx.lineTo(ix + notch, iy + ih);
        ctx.lineTo(ix, iy + ih - notch);
        ctx.lineTo(ix, iy + notch);
        ctx.closePath();
      }

      // 1. 絢麗撞色底圖 (紫紺、胭脂紅、金茶漸層)
      const bgGrad = ctx.createLinearGradient(x, y, x + w, y + h);
      bgGrad.addColorStop(0, "rgba(30, 11, 54, 0.95)");
      bgGrad.addColorStop(0.35, "rgba(112, 16, 48, 0.94)");
      bgGrad.addColorStop(0.65, "rgba(136, 19, 55, 0.94)");
      bgGrad.addColorStop(1, "rgba(23, 37, 84, 0.95)");
      drawOfudaPath(0);
      ctx.fillStyle = bgGrad;
      ctx.fill();

      // 2. 內部青海波紋理與散落金箔砂子 (Gold Leaf Specks)
      ctx.save();
      drawOfudaPath(6);
      ctx.clip();

      // 繪製浮世繪青海波暗紋
      ctx.strokeStyle = "rgba(251, 191, 36, 0.12)";
      ctx.lineWidth = 2;
      for (let row = y; row < y + h + 60; row += 45) {
        for (let col = x; col < x + w + 80; col += 90) {
          const offsetX = ((row / 45) % 2) * 45;
          for (let r = 15; r <= 45; r += 15) {
            ctx.beginPath();
            ctx.arc(col + offsetX, row, r, Math.PI, 0);
            ctx.stroke();
          }
        }
      }

      // 撒金箔砂子與朱砂點
      for (let i = 0; i < 95; i++) {
        const gx = x + Math.random() * w;
        const gy = y + Math.random() * h;
        const size = 2 + Math.random() * 6;
        ctx.fillStyle = Math.random() > 0.3
          ? `rgba(251, 191, 36, ${0.25 + Math.random() * 0.55})`
          : `rgba(20, 184, 166, ${0.25 + Math.random() * 0.4})`;
        ctx.fillRect(gx, gy, size, size);
      }
      ctx.restore();

      // 3. 外層赤金太框與內層朱紅細框
      ctx.save();
      drawOfudaPath(0);
      ctx.shadowColor = "#fbbf24";
      ctx.shadowBlur = 15;
      ctx.lineWidth = 8;
      ctx.strokeStyle = "#fbbf24";
      ctx.stroke();

      drawOfudaPath(12);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#f43f5e";
      ctx.stroke();
      ctx.restore();

      // 4. 左右兩側傳統「朱印落款」裝飾牌
      function drawStamp(sx, sy, labelTop, labelBottom) {
        ctx.save();
        ctx.fillStyle = "#be123c";
        ctx.strokeStyle = "#fbbf24";
        ctx.lineWidth = 3;
        ctx.fillRect(sx, sy, 48, 130);
        ctx.strokeRect(sx, sy, 48, 130);
        ctx.fillStyle = "#fef08a";
        ctx.font = "bold 24px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(labelTop, sx + 24, sy + 42);
        ctx.fillText(labelBottom, sx + 24, sy + 88);
        ctx.restore();
      }
      drawStamp(x + 28, y + 60, "御", "札");
      drawStamp(x + w - 76, y + 60, "真", "理");

      // 5. 頂部與底部浮世繪題跋小字
      ctx.font = "bold 22px serif";
      ctx.fillStyle = "#fde047";
      ctx.textAlign = "center";
      ctx.fillText("❖ 退 魔 繪 卷 ・ 結 界 開 顯 ❖", 512, y + 42);

      ctx.font = "bold 20px serif";
      ctx.fillStyle = "#5eead4"; // 怪化貓經典青綠撞色
      ctx.fillText("【 點 擊 繪 卷 影 像 進 入 異 界 傳 送 門 】", 512, y + h - 32);

      // 6. 中央主文字 (濃金襯底 + 象牙白明朝體)
      ctx.save();
      ctx.font = "900 46px 'Noto Serif TC', 'Songti TC', serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = "#000000";
      ctx.shadowBlur = 8;
      ctx.lineWidth = 8;
      ctx.strokeStyle = "#881337";
      ctx.strokeText(text || "👉 點擊任意影片前往官方網站！", 512, y + h / 2 + 2);

      ctx.fillStyle = "#fef9c3";
      ctx.fillText(text || "👉 點擊任意影片前往官方網站！", 512, y + h / 2 + 2);
      ctx.restore();

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // =========================================================
    // 怪化貓視覺工具 2：繪製「退魔八卦曼荼羅結界陣」(圖卡與角色底座)
    // =========================================================
    function createMononokeMandalaTexture() {
      const cvs = document.createElement('canvas');
      cvs.width = 512;
      cvs.height = 512;
      const ctx = cvs.getContext('2d');
      const cx = 256, cy = 256;

      ctx.translate(cx, cy);

      // 外圈朱紅與赤金雙環
      ctx.strokeStyle = "#e11d48";
      ctx.lineWidth = 8;
      ctx.beginPath(); ctx.arc(0, 0, 236, 0, Math.PI * 2); ctx.stroke();

      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, 222, 0, Math.PI * 2); ctx.stroke();

      // 繪製八芒星結界幾何陣 (Octagram)
      for (let k = 0; k < 2; k++) {
        ctx.save();
        ctx.rotate((k * Math.PI) / 4);
        ctx.strokeStyle = k === 0 ? "#fbbf24" : "#2dd4bf";
        ctx.lineWidth = 4;
        ctx.strokeRect(-150, -150, 300, 300);
        ctx.restore();
      }

      // 放射符文刻度
      ctx.strokeStyle = "rgba(251, 191, 36, 0.7)";
      ctx.lineWidth = 3;
      for (let i = 0; i < 16; i++) {
        ctx.save();
        ctx.rotate((i * Math.PI) / 8);
        ctx.beginPath();
        ctx.moveTo(0, -185);
        ctx.lineTo(0, -218);
        ctx.stroke();
        ctx.restore();
      }

      // 內圈紫紺朱印環
      ctx.strokeStyle = "#f43f5e";
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, 120, 0, Math.PI * 2); ctx.stroke();

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // =========================================================
    // 怪化貓視覺工具 3：建立影片周圍的「朱紅金箔隅切護符框」
    // =========================================================
    function createTalismanVideoFrame(width, height) {
      const group = new THREE.Group();
      const hw = width / 2;
      const hh = height / 2;
      const c = Math.min(width, height) * 0.22;

      // 外層赤金護角
      const goldPts = [
        -hw, hh - c, 0,  -hw, hh, 0,   -hw, hh, 0,  -hw + c, hh, 0,
        hw - c, hh, 0,   hw, hh, 0,    hw, hh, 0,   hw, hh - c, 0,
        hw, -hh + c, 0,  hw, -hh, 0,   hw, -hh, 0,  hw - c, -hh, 0,
        -hw + c, -hh, 0, -hw, -hh, 0,  -hw, -hh, 0, -hw, -hh + c, 0
      ];
      const goldGeo = new THREE.BufferGeometry();
      goldGeo.setAttribute('position', new THREE.Float32BufferAttribute(goldPts, 3));
      const goldLine = new THREE.LineSegments(
        goldGeo,
        new THREE.LineBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.95, depthWrite: false })
      );

      // 內層朱紅細框
      const redGeo = new THREE.EdgesGeometry(new THREE.PlaneGeometry(width * 0.94, height * 0.94));
      const redLine = new THREE.LineSegments(
        redGeo,
        new THREE.LineBasicMaterial({ color: 0xe11d48, transparent: true, opacity: 0.7, depthWrite: false })
      );
      redLine.position.z = -0.002;

      group.add(goldLine);
      group.add(redLine);
      return group;
    }

    async function init() {
      if (checkInAppBrowser()) return;

      try {
        statusMsg.innerText = "⏳ [壹/參] 正在讀取 config.json 繪卷設定檔...";
        const res = await fetch(`./config.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`找不到 config.json (HTTP ${res.status})`);
        config = await res.json();

        statusMsg.innerText = "⏳ [貳/參] 正在載入 3D 與 AR 結界核心...";
        THREE = await import('three');
        const mindarModule = await import('mindar-image-three');
        MindARThree = mindarModule.MindARThree;

        if (THREE.ColorManagement) {
          THREE.ColorManagement.enabled = false;
        }

        statusMsg.innerText = "⏳ [參/參] 正在檢驗已發布的影像資產...";
        if (config.videos && Array.isArray(config.videos)) {
          for (let i = 0; i < config.videos.length; i++) {
            const vConf = config.videos[i];
            const exists = await checkVideoExists(vConf.url);
            if (exists) {
              const v = document.createElement('video');
              v.src = `${vConf.url}?t=${Date.now()}`;
              v.loop = true;
              v.muted = true;
              v.playsInline = true;
              v.setAttribute('playsinline', '');
              v.setAttribute('webkit-playsinline', '');
              v.setAttribute('preload', 'auto');
              v.crossOrigin = "anonymous";
              preloadPool.appendChild(v);
              v.load();
              validVideoItems.push({ index: i + 1, element: v, config: vConf });
            }
          }
        }

        statusMsg.innerText = `✅ 結界準備就緒（已載入 ${validVideoItems.length} 卷靈像）\n請將鏡頭對準實體圖卡`;
        startBtn.innerText = "【 解 封 結 界 // 啟 動 實 境 】";
        startBtn.disabled = false;
        startBtn.onclick = startAR;

      } catch (err) {
        console.error(err);
        statusMsg.className = 'text-error';
        statusMsg.innerText = `初始化失敗：\n${err.message}`;
        startBtn.innerText = "結界異常";
      }
    }

    async function startAR() {
      startBtn.disabled = true;
      startBtn.innerText = "開啟天眼鏡頭中...";

      // 第一時間同步喚醒所有影片，取得行動端播放授權
      validVideoItems.forEach(item => {
        item.element.play().catch(e => console.warn(`影片 ${item.index} 初始喚醒:`, e));
      });

      try {
        const container = document.querySelector("#ar-container");

        // 【穩定化核心 1】：調降 filterMinCF 與 filterBeta，大幅壓制手機移動時的抖動與邊緣拉扯
        const mindarThree = new MindARThree({
          container: container,
          imageTargetSrc: `./targets.mind?t=${Date.now()}`,
          uiLoading: "no",
          uiScanning: "no",
          filterMinCF: 0.0001,
          filterBeta: 0.001,
          missTolerance: 8,
          warmupTolerance: 3
        });

        const { renderer, scene, camera } = mindarThree;
        renderer.setClearColor(0x000000, 0);

        // 原始追蹤錨點 (僅作為座標數據源)
        const rawAnchor = mindarThree.addAnchor(0);

        // 【穩定化核心 2】：建立獨立於場景的「平滑防手震立體群組 (smoothGroup)」
        const smoothGroup = new THREE.Group();
        smoothGroup.visible = false;
        scene.add(smoothGroup);

        const clickables = [];

        // =========================================================
        // A. 底層 (Z = 0.01)：圖卡表面退魔八卦曼荼羅結界陣
        // =========================================================
        const mandalaTex = createMononokeMandalaTexture();
        const mandalaMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1.05, 1.05),
          new THREE.MeshBasicMaterial({
            map: mandalaTex,
            transparent: true,
            opacity: 0.85,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        mandalaMesh.position.set(0, 0, 0.01);
        smoothGroup.add(mandalaMesh);

        // =========================================================
        // B. 中層 (Z = 0.02 ~ 0.28)：3D 漂浮金箔靈子粒子系統 (強化空間景深)
        // =========================================================
        const particleCount = 45;
        const pPositions = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
          pPositions[i * 3] = (Math.random() - 0.5) * 1.4;
          pPositions[i * 3 + 1] = (Math.random() - 0.5) * 1.4;
          pPositions[i * 3 + 2] = 0.02 + Math.random() * 0.26; // 分布於空中不同深度
        }
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        const pMat = new THREE.PointsMaterial({
          color: 0xfbbf24,
          size: 0.035,
          transparent: true,
          opacity: 0.85,
          depthWrite: false
        });
        const goldParticles = new THREE.Points(pGeo, pMat);
        smoothGroup.add(goldParticles);

        // =========================================================
        // C. 頂層 (Z = 0.14)：御札浮世繪浮空文字看板
        // =========================================================
        const bannerTexture = createMononokeBannerTexture(config.bannerText);
        const bannerMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1.32, 0.38),
          new THREE.MeshBasicMaterial({
            map: bannerTexture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          })
        );
        const baseBannerY = (config.bannerPosY !== undefined) ? Number(config.bannerPosY) : 0.65;
        bannerMesh.position.set(0, baseBannerY, 0.14);
        bannerMesh.renderOrder = 20;
        smoothGroup.add(bannerMesh);
        clickables.push(bannerMesh);

        // =========================================================
        // D. 前景立體層 (Z = 0.16)：去背影片 + 和紙金箔著色器 + 動態長寬比校正
        // =========================================================
        const vShader = `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `;
        const fShader = `
          uniform sampler2D textureMap;
          uniform vec3 keyColor;
          uniform float similarity;
          uniform float smoothness;
          uniform float uTime;
          varying vec2 vUv;

          // 浮世繪和紙微紋理隨機雜訊函數
          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
          }

          void main() {
            vec4 col = texture2D(textureMap, vUv);
            float diff = length(col.rgb - keyColor);
            float alpha = smoothstep(similarity, similarity + smoothness, diff);

            // 1. 和紙纖維微質感 (Washi Paper Grain)
            float paperGrain = (hash(floor(vUv * 240.0)) - 0.5) * 0.04;

            // 2. 金箔瑞氣流光波紋 (Golden Spirit Shimmer)
            float wave = sin(vUv.y * 8.0 - uTime * 2.2 + sin(vUv.x * 6.0) * 1.5);
            float goldSweep = smoothstep(0.82, 1.0, wave) * 0.18;

            // 3. 邊緣朱金靈氣光暈
            float edgeAura = smoothstep(0.1, 0.45, alpha) * (1.0 - smoothstep(0.45, 0.95, alpha));
            vec3 mononokeTint = vec3(1.0, 0.84, 0.25) * goldSweep + vec3(0.95, 0.2, 0.35) * edgeAura * 0.35;

            vec3 finalRgb = clamp(col.rgb + paperGrain + mononokeTint * alpha, 0.0, 1.0);
            gl_FragColor = vec4(finalRgb, col.a * alpha);
          }
        `;

        const activeVideoObjects = [];
        const basePlaneHeight = 0.55; // 基準高度，寬度將依影片真實比例自動調整

        validVideoItems.forEach((item, idx) => {
          const v = item.element;
          const vConfig = item.config;

          const vTexture = new THREE.VideoTexture(v);
          vTexture.minFilter = THREE.LinearFilter;
          vTexture.magFilter = THREE.LinearFilter;

          const mat = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: vTexture },
              keyColor: { value: new THREE.Color(vConfig.keyColor || "#00ff00") },
              similarity: { value: Number(vConfig.similarity ?? 0.4) },
              smoothness: { value: Number(vConfig.smoothness ?? 0.1) },
              uTime: { value: 0.0 }
            },
            vertexShader: vShader,
            fragmentShader: fShader,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          // 建立 1:1 基礎平面，稍後透過 scale.x 自動套用真實長寬比，徹底解決左右拉大變形
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(basePlaneHeight, basePlaneHeight), mat);

          const baseX = Number(vConfig.px || 0);
          const baseY = Number(vConfig.py || 0);
          const baseZ = 0.16 + idx * 0.02; // 顯著拔高 Z 軸，創造真實空中懸浮視差
          const baseRY = THREE.MathUtils.degToRad(Number(vConfig.ry || 0));
          const baseRZ = THREE.MathUtils.degToRad(Number(vConfig.rz || 0));

          mesh.position.set(baseX, baseY, baseZ);
          mesh.rotation.set(0, baseRY, baseRZ);
          mesh.renderOrder = 10 + idx;

          // 掛載怪化貓朱紅金箔護符外框
          const talismanFrame = createTalismanVideoFrame(basePlaneHeight * 1.08, basePlaneHeight * 1.08);
          talismanFrame.position.set(0, 0, -0.005);
          mesh.add(talismanFrame);

          // 在圖卡表面 (Z = 0.015) 建立該角色的「專屬底部結界投影底座」，凸顯空中浮動的高度差
          const shadowSeal = new THREE.Mesh(
            new THREE.RingGeometry(0.12, 0.22, 24),
            new THREE.MeshBasicMaterial({
              color: 0xe11d48,
              side: THREE.DoubleSide,
              transparent: true,
              opacity: 0.5,
              depthWrite: false
            })
          );
          shadowSeal.position.set(baseX, baseY, 0.015);
          smoothGroup.add(shadowSeal);

          smoothGroup.add(mesh);
          clickables.push(mesh);

          activeVideoObjects.push({
            id: item.index,
            video: v,
            texture: vTexture,
            material: mat,
            mesh: mesh,
            shadowSeal: shadowSeal,
            baseX, baseY, baseZ, baseRY, baseRZ,
            aspectCalibrated: false,
            phase: idx * 2.1
          });
        });

        // =========================================================
        // E. 追蹤狀態與雙重阻尼平滑變數 (LERP / SLERP)
        // =========================================================
        let isTargetLocked = false;
        let hasInitializedPose = false;

        const targetPos = new THREE.Vector3();
        const targetQuat = new THREE.Quaternion();
        const targetScale = new THREE.Vector3();

        const smoothPos = new THREE.Vector3();
        const smoothQuat = new THREE.Quaternion();
        const smoothScale = new THREE.Vector3();

        rawAnchor.onTargetFound = () => {
          isTargetLocked = true;
          hud.style.borderColor = "#fbbf24";
          hud.style.color = "#fef08a";
          hud.innerHTML = "🟢 【 結界開顯 // モノノ怪・現形 】";
          validVideoItems.forEach(item => {
            if (item.element.paused) item.element.play().catch(() => {});
          });
        };

        rawAnchor.onTargetLost = () => {
          isTargetLocked = false;
          hasInitializedPose = false;
          smoothGroup.visible = false;
          hud.style.borderColor = "#f43f5e";
          hud.style.color = "#fda4af";
          hud.innerHTML = "📡 【 尋覓：形・真・理 // 請對準繪卷圖卡 】";
        };

        await mindarThree.start();

        overlay.style.display = 'none';
        hud.style.display = 'block';
        debugPanel.style.display = 'block';

        // =========================================================
        // F. 渲染迴圈：執行矩陣防抖插值、比例校正與 3D 空氣懸浮律動
        // =========================================================
        const clock = new THREE.Clock();

        renderer.setAnimationLoop(() => {
          const elapsedTime = clock.getElapsedTime();

          // 1. 執行雙重防手震插值：過濾手機移動時的旋轉扭曲與抖動
          if (isTargetLocked) {
            rawAnchor.group.matrix.decompose(targetPos, targetQuat, targetScale);

            if (targetScale.x > 0.0001) {
              if (!hasInitializedPose) {
                smoothPos.copy(targetPos);
                smoothQuat.copy(targetQuat);
                smoothScale.copy(targetScale);
                hasInitializedPose = true;
              } else {
                // 位移採用 0.20 平滑跟隨；旋轉採用 0.10 強效阻尼，抑制手機移動造成的平面歪斜拉扯
                smoothPos.lerp(targetPos, 0.20);
                smoothQuat.slerp(targetQuat, 0.10);
                smoothScale.lerp(targetScale, 0.20);
              }
              smoothGroup.visible = true;
              smoothGroup.position.copy(smoothPos);
              smoothGroup.quaternion.copy(smoothQuat);
              smoothGroup.scale.copy(smoothScale);
            }
          }

          // 2. 退魔八卦曼荼羅陣慢速旋轉
          mandalaMesh.rotation.z = elapsedTime * 0.35;

          // 3. 3D 金箔靈子緩緩上升漂浮
          const posAttr = goldParticles.geometry.attributes.position;
          for (let i = 0; i < particleCount; i++) {
            let z = posAttr.getZ(i) + 0.0012;
            if (z > 0.30) z = 0.02;
            posAttr.setZ(i, z);
          }
          posAttr.needsUpdate = true;
          goldParticles.rotation.z = Math.sin(elapsedTime * 0.4) * 0.15;

          // 4. 御札文字框立體呼吸浮動
          bannerMesh.position.y = baseBannerY + Math.sin(elapsedTime * 2.0) * 0.018;
          bannerMesh.position.z = 0.14 + Math.cos(elapsedTime * 1.6) * 0.012;
          bannerMesh.rotation.x = Math.sin(elapsedTime * 1.5) * 0.06;

          // 5. 影片動態真實比例校正 + 3D 空中懸浮搖擺
          let vStatusText = "";
          activeVideoObjects.forEach(vo => {
            vo.material.uniforms.uTime.value = elapsedTime;

            if (vo.video.readyState >= vo.video.HAVE_CURRENT_DATA) {
              vo.texture.needsUpdate = true;

              // 自動偵測影片真實寬高比並校正 Mesh，徹底消除橫向拉大變形
              if (!vo.aspectCalibrated && vo.video.videoWidth > 0 && vo.video.videoHeight > 0) {
                const aspect = vo.video.videoWidth / vo.video.videoHeight;
                vo.mesh.scale.set(aspect, 1, 1);
                vo.aspectCalibrated = true;
              }
            }

            // 讓影片在空中產生真實 3D 懸浮感 (Y軸上下浮動 + Z軸前後呼吸 + 微幅立體偏擺)
            const t = elapsedTime + vo.phase;
            vo.mesh.position.y = vo.baseY + Math.sin(t * 2.2) * 0.025;
            vo.mesh.position.z = vo.baseZ + Math.cos(t * 1.8) * 0.025;
            vo.mesh.rotation.y = vo.baseRY + Math.sin(t * 1.4) * 0.12;
            vo.mesh.rotation.x = Math.cos(t * 1.2) * 0.08;

            // 底部結界底座隨角色高度反向縮放，強化大腦對「離地高度」的 3D 錯覺
            const shadowScale = 1.0 - Math.cos(t * 1.8) * 0.15;
            vo.shadowSeal.scale.set(shadowScale, shadowScale, 1);
            vo.shadowSeal.rotation.z = -elapsedTime * 0.8;

            vStatusText += `靈像${vo.id}: ${vo.video.paused ? '暫停' : '顯現中'} (${vo.video.videoWidth}x${vo.video.videoHeight} | 比例已校正)\n`;
          });

          debugPanel.innerText =
            `[退魔結界診斷] 狀態: ${isTargetLocked ? '已鎖定 (SLERP防震開啟)' : '尋覓中'}\n` +
            `景深高度 Z: 角色 0.16 / 看板 0.14 / 結界 0.01\n` +
            (vStatusText || "無有效影片檔案");

          renderer.render(scene, camera);
        });

        // =========================================================
        // G. 點擊與觸控跳轉判定
        // =========================================================
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        function handleInteract(clientX, clientY) {
          if (!isTargetLocked) return;
          pointer.x = (clientX / window.innerWidth) * 2 - 1;
          pointer.y = -(clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const intersects = raycaster.intersectObjects(clickables, false);
          if (intersects.length > 0 && config.redirectUrl) {
            window.location.href = config.redirectUrl;
          }
        }

        window.addEventListener('click', (e) => handleInteract(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length > 0) {
            handleInteract(e.touches[0].clientX, e.touches[0].clientY);
          }
        }, { passive: true });

      } catch (err) {
        console.error(err);
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerText = `相機或 AR 啟動失敗：\n${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
