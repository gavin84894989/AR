<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 觀看端</title>

  <!-- 1. 官方標準 importmap 模組映射設定 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #ar-container { 
      position: relative; 
      width: 100vw; 
      height: 100vh; 
      overflow: hidden; 
    }
    
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 999; color: white; text-align: center; padding: 20px; box-sizing: border-box;
    }
    
    #start-btn {
      padding: 14px 28px; font-size: 18px; border: none; border-radius: 8px;
      background: #007aff; color: white; cursor: pointer; font-weight: bold;
    }

    #error-msg {
      margin-top: 15px; color: #ff4d4f; font-size: 14px; white-space: pre-wrap; line-height: 1.5;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <h2>WebAR 互動體驗</h2>
    <button id="start-btn">正在載入設定檔...</button>
    <div id="error-msg"></div>
  </div>

  <div id="ar-container"></div>

  <!-- 2. 改以 ES Module 運行核心邏輯 -->
  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const errorMsg = document.getElementById('error-msg');
    let config = null;

    // 檢查通訊軟體內建瀏覽器
    function checkInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf('Line') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1) {
        startBtn.style.display = 'none';
        errorMsg.innerHTML = "⚠️ <b>無法在通訊軟體中開啟</b><br><br>請點選右上角選單：<br>👉 選擇<b>「以 Safari / Chrome 開啟」</b>。";
        return true;
      }
      return false;
    }

    // 讀取設定檔
    async function init() {
      if (checkInAppBrowser()) return;

      try {
        const res = await fetch(`./config.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("找不到 config.json，請先至後台完成一次發布！");
        config = await res.json();
        
        startBtn.innerText = "點擊啟動 AR 鏡頭";
        startBtn.disabled = false;
        startBtn.onclick = startAR;
      } catch (e) {
        startBtn.style.display = 'none';
        errorMsg.innerText = e.message;
      }
    }

    // 啟動 AR
    async function startAR() {
      startBtn.disabled = true;
      startBtn.innerText = "相機啟動中，請稍候...";
      errorMsg.innerText = "";

      try {
        // 直接使用匯入的 MindARThree 建構
        const mindarThree = new MindARThree({
          container: document.querySelector("#ar-container"),
          imageTargetSrc: `./targets.mind?t=${Date.now()}`
        });

        const { renderer, scene, camera } = mindarThree;
        const anchor = mindarThree.addAnchor(0);

        // 3D 浮空說明看板
        const cvs = document.createElement('canvas');
        cvs.width = 1024; cvs.height = 256;
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = "rgba(10, 10, 10, 0.85)";
        ctx.beginPath();
        ctx.roundRect(20, 20, 984, 216, 40);
        ctx.fill();
        ctx.lineWidth = 8; ctx.strokeStyle = "#007aff"; ctx.stroke();
        ctx.font = "bold 52px -apple-system, sans-serif"; ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(config.bannerText, 512, 128);

        const bannerSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cvs) }));
        bannerSprite.scale.set(1.6, 0.4, 1);
        bannerSprite.position.set(0, config.bannerPosY || 1.2, 0.1);
        anchor.group.add(bannerSprite);

        const clickables = [bannerSprite];

        // WebGL 去背著色器
        const vShader = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
        const fShader = `
          uniform sampler2D textureMap; uniform vec3 keyColor; uniform float similarity; uniform float smoothness; varying vec2 vUv;
          void main() {
            vec4 col = texture2D(textureMap, vUv);
            float diff = length(col.rgb - keyColor);
            float alpha = smoothstep(similarity, similarity + smoothness, diff);
            gl_FragColor = vec4(col.rgb, col.a * alpha);
          }
        `;

        // 載入 3 支影片
        config.videos.forEach(vConfig => {
          const v = document.createElement('video');
          v.src = `${vConfig.url}?t=${Date.now()}`;
          v.loop = true;
          v.playsInline = true;
          v.muted = true;
          v.crossOrigin = "anonymous";
          v.play().catch(e => console.warn("影片自動播放受阻:", e));

          const mat = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: new THREE.VideoTexture(v) },
              keyColor: { value: new THREE.Color(vConfig.keyColor) },
              similarity: { value: vConfig.similarity },
              smoothness: { value: vConfig.smoothness }
            },
            vertexShader: vShader,
            fragmentShader: fShader,
            transparent: true
          });

          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.4), mat);
          mesh.position.set(vConfig.px, vConfig.py, 0.05);
          mesh.rotation.y = THREE.MathUtils.degToRad(vConfig.ry);
          mesh.rotation.z = THREE.MathUtils.degToRad(vConfig.rz);

          anchor.group.add(mesh);
          clickables.push(mesh);
        });

        // 啟動相機追蹤
        await mindarThree.start();
        
        // 成功取得相機串流後關閉遮罩
        overlay.style.display = 'none';

        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

        // 點擊判定跳轉
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('click', (e) => {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          if (raycaster.intersectObjects(clickables).length > 0) {
            window.location.href = config.redirectUrl;
          }
        });

      } catch (err) {
        console.error(err);
        startBtn.style.display = 'none';
        errorMsg.innerText = `相機啟動失敗：\n${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
