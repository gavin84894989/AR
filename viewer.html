<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 觀看端</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #000; font-family: -apple-system, sans-serif;
    }
    
    #ar-container { 
      position: absolute; top: 0; left: 0; 
      width: 100vw; height: 100vh; overflow: hidden; 
    }

    /* 頂部追蹤狀態指示 HUD */
    #tracker-hud {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      z-index: 100; padding: 8px 18px; border-radius: 20px;
      font-size: 14px; font-weight: bold; color: white;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
      display: none; transition: background 0.3s; pointer-events: none;
    }
    
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.88); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 999; color: white; text-align: center; padding: 20px;
    }
    
    #start-btn {
      padding: 15px 32px; font-size: 18px; border: none; border-radius: 8px;
      background: #007aff; color: white; cursor: pointer; font-weight: bold;
    }
    #start-btn:disabled { background: #555; }

    #status-msg {
      margin-top: 15px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; max-width: 90%;
    }
    .text-error { color: #ff4d4f; font-weight: bold; }
    .text-info { color: #ccc; }
  </style>
</head>
<body>

  <div id="tracker-hud">🟡 正在尋找目標圖卡...</div>

  <div id="overlay">
    <h2>WebAR 互動體驗</h2>
    <button id="start-btn" disabled>連線中...</button>
    <div id="status-msg" class="text-info">正在檢查連線環境...</div>
  </div>

  <div id="ar-container"></div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const statusMsg = document.getElementById('status-msg');
    const hud = document.getElementById('tracker-hud');
    let config = null;

    function checkInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf('Line') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1) {
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerHTML = "⚠️ <b>無法在通訊軟體內建瀏覽器中開啟</b><br><br>請點選右上角選單：<br>👉 選擇<b>「以 Safari / Chrome 開啟」</b>。";
        return true;
      }
      return false;
    }

    function getMindARThree() {
      if (window.MINDAR && window.MINDAR.IMAGE && window.MINDAR.IMAGE.MindARThree) return window.MINDAR.IMAGE.MindARThree;
      if (window.MindARThree) return window.MindARThree;
      return null;
    }

    async function init() {
      if (checkInAppBrowser()) return;

      statusMsg.className = 'text-info';
      statusMsg.innerText = "⏳ 正在讀取 config.json 設定檔...";

      try {
        const res = await fetch(`./config.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("找不到 config.json，請先由後台發布設定！");
        config = await res.json();

        let Engine = getMindARThree();
        if (!Engine) {
          statusMsg.innerText = "⏳ 正在載入 AR 核心引擎...";
          await new Promise(r => setTimeout(r, 600));
          Engine = getMindARThree();
        }

        if (!Engine) throw new Error("AR 核心引擎未能載入，請重新整理！");

        statusMsg.innerText = "✅ 準備就緒，請備妥實體圖卡";
        startBtn.innerText = "點擊啟動 AR 鏡頭";
        startBtn.disabled = false;
        startBtn.onclick = startAR;

      } catch (err) {
        console.error(err);
        statusMsg.className = 'text-error';
        statusMsg.innerText = err.message;
      }
    }

    async function startAR() {
      startBtn.disabled = true;
      startBtn.innerText = "啟動中，請稍候...";

      try {
        const container = document.querySelector("#ar-container");
        const MindARThreeClass = getMindARThree();

        const mindarThree = new MindARThreeClass({
          container: container,
          imageTargetSrc: `./targets.mind?t=${Date.now()}`,
          uiLoading: "no",
          uiScanning: "yes"
        });

        const { renderer, scene, camera } = mindarThree;
        
        // 確保畫布背景 100% 透明穿透相機
        renderer.setClearColor(0x000000, 0);

        const anchor = mindarThree.addAnchor(0);
        const clickables = [];

        // 1. 【關鍵修復】：加入實體定位框 (1x1)，保證鎖定時立刻看見反應
        const edgeGeometry = new THREE.EdgesGeometry(new THREE.PlaneGeometry(1, 1));
        const edgeLine = new THREE.LineSegments(
          edgeGeometry,
          new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 })
        );
        edgeLine.position.z = 0.01;
        anchor.group.add(edgeLine);

        // 2. 【關鍵修復】：浮空看板捨棄 Sprite，改用實體雙面 Mesh 平面
        const cvs = document.createElement('canvas');
        cvs.width = 1024; cvs.height = 256;
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = "rgba(15, 23, 42, 0.9)";
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(10, 10, 1004, 236, 32);
        else ctx.rect(10, 10, 1004, 236);
        ctx.fill();
        ctx.lineWidth = 10; ctx.strokeStyle = "#007aff"; ctx.stroke();
        ctx.font = "bold 50px sans-serif"; ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(config.bannerText || "👉 點擊前往官方網站！", 512, 128);

        const bannerTexture = new THREE.CanvasTexture(cvs);
        const bannerMesh = new THREE.Mesh(
          new THREE.PlaneGeometry(1.2, 0.3),
          new THREE.MeshBasicMaterial({ map: bannerTexture, transparent: true, side: THREE.DoubleSide })
        );
        // 將看板放置在圖卡正上方 (Y = 0.65)，確保手機近距離也能看見
        bannerMesh.position.set(0, 0.65, 0.05);
        anchor.group.add(bannerMesh);
        clickables.push(bannerMesh);

        // 3. WebGL 去背著色器
        const vShader = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
        const fShader = `
          uniform sampler2D textureMap; uniform vec3 keyColor; uniform float similarity; uniform float smoothness; varying vec2 vUv;
          void main() {
            vec4 col = texture2D(textureMap, vUv);
            float diff = length(col.rgb - keyColor);
            float alpha = smoothstep(similarity, similarity + smoothness, diff);
            gl_FragColor = vec4(col.rgb, col.a * alpha);
          }
        `;

        const activeTextures = [];

        // 4. 載入 3 支影片與備援占位物件
        config.videos.forEach((vConfig, idx) => {
          const v = document.createElement('video');
          v.src = `${vConfig.url}?t=${Date.now()}`;
          v.loop = true;
          v.muted = true;
          v.playsInline = true;
          v.setAttribute('playsinline', '');
          v.setAttribute('webkit-playsinline', '');
          v.crossOrigin = "anonymous";

          // 備援占位外框 (若影片載入失敗或正在載入時顯示)
          const placeholder = new THREE.Mesh(
            new THREE.PlaneGeometry(0.8, 0.5),
            new THREE.MeshBasicMaterial({ color: 0x334155, wireframe: true, side: THREE.DoubleSide })
          );
          placeholder.position.set(vConfig.px, vConfig.py, 0.03);
          placeholder.rotation.y = THREE.MathUtils.degToRad(vConfig.ry);
          placeholder.rotation.z = THREE.MathUtils.degToRad(vConfig.rz);
          anchor.group.add(placeholder);

          // 影片紋理
          const vTexture = new THREE.VideoTexture(v);
          vTexture.minFilter = THREE.LinearFilter;
          vTexture.magFilter = THREE.LinearFilter;
          vTexture.format = THREE.RGBAFormat;
          activeTextures.push(vTexture);

          const mat = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: vTexture },
              keyColor: { value: new THREE.Color(vConfig.keyColor) },
              similarity: { value: vConfig.similarity },
              smoothness: { value: vConfig.smoothness }
            },
            vertexShader: vShader,
            fragmentShader: fShader,
            transparent: true,
            side: THREE.DoubleSide
          });

          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.5), mat);
          mesh.position.set(vConfig.px, vConfig.py, 0.05);
          mesh.rotation.y = THREE.MathUtils.degToRad(vConfig.ry);
          mesh.rotation.z = THREE.MathUtils.degToRad(vConfig.rz);

          anchor.group.add(mesh);
          clickables.push(mesh);

          // 手勢內喚醒播放
          v.play().catch(e => console.warn(`影片 ${idx + 1} 播放受阻:`, e));
        });

        // 5. 追蹤狀態事件
        anchor.onTargetFound = () => {
          hud.style.background = "rgba(40, 167, 69, 0.85)";
          hud.innerHTML = "🟢 目標已鎖定！";
        };
        anchor.onTargetLost = () => {
          hud.style.background = "rgba(0, 0, 0, 0.7)";
          hud.innerHTML = "🟡 正在尋找目標圖卡...";
        };

        // 6. 啟動 MindAR
        await mindarThree.start();

        overlay.style.display = 'none';
        hud.style.display = 'block';

        renderer.setAnimationLoop(() => {
          for (let i = 0; i < activeTextures.length; i++) {
            if (activeTextures[i]) activeTextures[i].needsUpdate = true;
          }
          renderer.render(scene, camera);
        });

        // 點擊判定跳轉
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('click', (e) => {
          mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
          mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
          raycaster.setFromCamera(mouse, camera);
          if (raycaster.intersectObjects(clickables).length > 0) {
            window.location.href = config.redirectUrl;
          }
        });

      } catch (err) {
        console.error(err);
        startBtn.style.display = 'none';
        statusMsg.className = "text-error";
        statusMsg.innerText = `啟動失敗：\n${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
