<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR 觀看端</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #ar-container { width: 100vw; height: 100vh; }
    #overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex; justify-content: center;
      align-items: center; z-index: 999;
    }
    #start-btn {
      padding: 14px 28px; font-size: 18px; border: none; border-radius: 8px;
      background: #007aff; color: white; cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="overlay">
    <button id="start-btn">正在讀取設定檔...</button>
  </div>
  <div id="ar-container"></div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    let config = null;

    // 1. 抓取最新 config.json (加入快取清除參數)
    async function init() {
      try {
        const res = await fetch(`./config.json?t=${Date.now()}`);
        if (!res.ok) throw new Error("尚未找到 config.json，請先由後台發布！");
        config = await res.json();
        startBtn.innerText = "點擊啟動 AR";
        startBtn.onclick = startAR;
      } catch (e) {
        startBtn.innerText = e.message;
      }
    }

    async function startAR() {
      overlay.style.display = 'none';

      // 2. 初始化 MindAR (載入專案特徵檔 targets.mind)
      const mindarThree = new window.MINDAR.IMAGE.MindARThree({
        container: document.querySelector("#ar-container"),
        imageTargetSrc: `./targets.mind?t=${Date.now()}`
      });
      const { renderer, scene, camera } = mindarThree;
      const anchor = mindarThree.addAnchor(0);

      // 3. 建立 3D 浮空說明看板
      const cvs = document.createElement('canvas');
      cvs.width = 1024; cvs.height = 256;
      const ctx = cvs.getContext('2d');
      ctx.fillStyle = "rgba(10, 10, 10, 0.85)";
      ctx.beginPath();
      ctx.roundRect(20, 20, 984, 216, 40);
      ctx.fill();
      ctx.lineWidth = 8; ctx.strokeStyle = "#007aff"; ctx.stroke();
      ctx.font = "bold 52px sans-serif"; ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(config.bannerText, 512, 128);

      const bannerSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cvs) }));
      bannerSprite.scale.set(1.6, 0.4, 1);
      bannerSprite.position.set(0, config.bannerPosY || 1.2, 0.1);
      anchor.group.add(bannerSprite);

      const clickables = [bannerSprite];

      // 4. 定義去背著色器
      const vShader = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
      const fShader = `
        uniform sampler2D textureMap; uniform vec3 keyColor; uniform float similarity; uniform float smoothness; varying vec2 vUv;
        void main() {
          vec4 col = texture2D(textureMap, vUv);
          float diff = length(col.rgb - keyColor);
          float alpha = smoothstep(similarity, similarity + smoothness, diff);
          gl_FragColor = vec4(col.rgb, col.a * alpha);
        }
      `;

      // 5. 建立 3 支循環播放影片平面
      config.videos.forEach(vConfig => {
        const v = document.createElement('video');
        v.src = `${vConfig.url}?t=${Date.now()}`;
        v.loop = true;
        v.playsInline = true;
        v.crossOrigin = "anonymous";
        v.play();

        const mat = new THREE.ShaderMaterial({
          uniforms: {
            textureMap: { value: new THREE.VideoTexture(v) },
            keyColor: { value: new THREE.Color(vConfig.keyColor) },
            similarity: { value: vConfig.similarity },
            smoothness: { value: vConfig.smoothness }
          },
          vertexShader: vShader,
          fragmentShader: fShader,
          transparent: true
        });

        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.7, 0.4), mat);
        mesh.position.set(vConfig.px, vConfig.py, 0.05);
        mesh.rotation.y = THREE.MathUtils.degToRad(vConfig.ry);
        mesh.rotation.z = THREE.MathUtils.degToRad(vConfig.rz);

        anchor.group.add(mesh);
        clickables.push(mesh);
      });

      // 6. 啟動追蹤
      await mindarThree.start();
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });

      // 7. 光線投射 (Raycaster) 點擊跳轉判定
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();
      window.addEventListener('click', (e) => {
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        if (raycaster.intersectObjects(clickables).length > 0) {
          window.location.href = config.redirectUrl;
        }
      });
    }

    init();
  </script>
</body>
</html>
