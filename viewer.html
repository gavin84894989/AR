<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- 防快取 Meta 標籤：確保手機端每次開啟皆載入最新設定 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR 觀看端</title>

  <!-- 官方同源模組映射 (Three.js r160 + GLTFLoader + Meshopt + MindAR 1.2.5) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* MindAR 主容器：嚴格維持原生尺寸計算，確保相機與 3D 畫布 1:1 對齊 */
    #ar-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent !important;
    }

    #ar-container video {
      z-index: 1 !important;
      pointer-events: none;
    }

    #ar-container canvas {
      z-index: 2 !important;
      pointer-events: none; /* 畫布本身不觸發連結，僅限透明點位層可點擊 */
    }

    /* 3D 轉 2D 僅限座標點位的原生透明連結覆蓋層 */
    #ar-link-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .ar-dom-link {
      position: fixed;
      display: none;
      background: rgba(255, 255, 255, 0); /* 100% 透明無標記 */
      pointer-events: auto;
      cursor: pointer;
      text-decoration: none;
      touch-action: none;
      -webkit-user-drag: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 隱藏預載影片池 (確保行動端硬體解碼器穩定運作) */
    #video-preload-pool {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      pointer-events: none;
      z-index: -1;
    }

    /* 頂部簡潔追蹤狀態燈 */
    #tracker-hud {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      pointer-events: none;
      white-space: nowrap;
      transition: background 0.2s;
    }

    /* 3D 模型串流下載進度提示條 */
    #model-progress-bar {
      position: fixed;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.5);
      display: none;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 啟動遮罩 */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #project-badge {
      font-size: 12px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    #start-btn {
      padding: 15px 36px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #007aff;
      color: white;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
    }

    #start-btn:disabled {
      background: #555;
      box-shadow: none;
    }

    #status-msg {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      max-width: 90%;
      color: #94a3b8;
    }

    .text-error {
      color: #ff4d4f !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 頂部狀態與 3D 模型進度顯示 -->
  <div id="tracker-hud">🟡 正在尋找目標圖卡...</div>
  <div id="model-progress-bar">⏳ 正在載入 3D 模型... 0%</div>

  <!-- 啟動前引導遮罩 -->
  <div id="overlay">
    <div id="project-badge">專案載入中...</div>
    <h2 id="project-title">WebAR 互動體驗</h2>
    <button id="start-btn" disabled>連線中...</button>
    <div id="status-msg">正在檢查環境與載入設定檔...</div>
  </div>

  <!-- AR 渲染容器與透明點位連結層 -->
  <div id="ar-container"></div>
  <div id="ar-link-layer"></div>
  <div id="video-preload-pool"></div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const statusMsg = document.getElementById('status-msg');
    const hud = document.getElementById('tracker-hud');
    const modelProgressBar = document.getElementById('model-progress-bar');
    const preloadPool = document.getElementById('video-preload-pool');
    const arLinkLayer = document.getElementById('ar-link-layer');
    const projectBadge = document.getElementById('project-badge');
    const projectTitleEl = document.getElementById('project-title');

    // =========================================================
    // 1. 解析網址參數 ?id=專案代號 (支援多產品專案隔離與根目錄向下相容)
    // =========================================================
    const urlParams = new URLSearchParams(window.location.search);
    const currentProjectId = (urlParams.get('id') || '').trim();
    projectBadge.innerText = currentProjectId ? `產品專案：${currentProjectId}` : `預設專案 (Root)`;

    function resolveProjectAssetUrl(rawPath) {
      if (!rawPath) return '';
      const trimmed = rawPath.trim();
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      const clean = trimmed.replace(/^\.\//, '').replace(/^\/+/, '');
      if (!currentProjectId) return `./${clean}`;
      if (clean.startsWith(`projects/${currentProjectId}/`)) return `./${clean}`;
      return `./projects/${currentProjectId}/${clean}`;
    }

    let THREE = null;
    let GLTFLoader = null;
    let DRACOLoader = null;
    let MeshoptDecoder = null;
    let MindARThree = null;
    let config = null;
    let activeMindARInstance = null;

    const validVideoItems = [];
    const validModelConfigs = [];
    let validImageLayer = null;
    let isTargetLocked = false;

    // 網址正規化：自動補齊 https://
    function normalizeUrl(rawUrl) {
      if (!rawUrl || typeof rawUrl !== 'string') return '';
      const trimmed = rawUrl.trim();
      if (!trimmed) return '';
      if (/^https?:\/\//i.test(trimmed)) return trimmed;
      return 'https://' + trimmed;
    }

    // 檢查是否於 LINE / FB 內建瀏覽器開啟
    function checkInAppBrowser() {
      const ua = navigator.userAgent || navigator.vendor || window.opera;
      if (ua.indexOf('Line') > -1 || ua.indexOf('FBAN') > -1 || ua.indexOf('FBAV') > -1) {
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerHTML = "⚠️ <b>無法在通訊軟體內建瀏覽器中開啟</b><br><br>請點選右上角選單：<br>👉 選擇<b>「以 Safari / Chrome 開啟」</b>。";
        return true;
      }
      return false;
    }

    // 檢查遠端媒體資產是否存在
    async function checkAssetExists(url) {
      if (!url) return false;
      if (/^https?:\/\//i.test(url)) return true;
      try {
        const res = await fetch(`${url}?t=${Date.now()}`, { method: 'HEAD' });
        return res.ok;
      } catch (e) {
        return false;
      }
    }

    // 繪製原版簡潔圓角浮空文字框
    function createCleanBannerTexture(text) {
      const cvs = document.createElement('canvas');
      cvs.width = 1024;
      cvs.height = 256;
      const ctx = cvs.getContext('2d');

      ctx.fillStyle = "rgba(10, 10, 10, 0.85)";
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(20, 20, 984, 216, 40);
      } else {
        ctx.rect(20, 20, 984, 216);
      }
      ctx.fill();

      ctx.lineWidth = 8;
      ctx.strokeStyle = "#007aff";
      ctx.stroke();

      ctx.font = "bold 50px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#ffffff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text || "👉 點擊標記點位前往連結！", 512, 128);

      const tex = new THREE.CanvasTexture(cvs);
      tex.needsUpdate = true;
      return tex;
    }

    // =========================================================
    // 2. 建立具備「短按 / 長按持久度分流 + 放開 100% 雙層跳轉」的點位連結
    // =========================================================
    const trackedDomLinks = [];
    let lastGlobalNavigateTime = 0;

    function launchTargetUrl(targetUrl, isLongPress) {
      if (!targetUrl) return;
      const now = performance.now();
      if (now - lastGlobalNavigateTime < 800) return;
      lastGlobalNavigateTime = now;

      // 記錄自動續掃標記，若使用者從歷史紀錄返回本頁可自動重啟相機
      try {
        sessionStorage.setItem('ar_auto_resume', '1');
      } catch (e) {}

      if (isLongPress) {
        hud.style.background = "rgba(147, 51, 234, 0.95)";
        hud.innerHTML = "🟣 正在開啟【長按連結】...";
      } else {
        hud.style.background = "rgba(0, 122, 255, 0.95)";
        hud.innerHTML = "🔗 正在開啟【短按連結】...";
      }

      // 第一層：優先嘗試於 touchend / mouseup 手勢中開啟新分頁 (_blank)
      let newWin = null;
      try {
        newWin = window.open(targetUrl, '_blank');
      } catch (err) {}

      // 第二層保底：若手機瀏覽器因長按超過 0.5 秒攔截了 _blank 彈窗 (newWin 為 null)，
      // 立即改用 location.href 強制開啟目標網頁，絕不發生放開沒反應的狀況！
      if (!newWin || newWin.closed || typeof newWin.closed === 'undefined') {
        window.location.href = targetUrl;
      }
    }

    function registerHotspotDomLink(mesh, spotConfig, zIndexVal) {
      const shortUrl = normalizeUrl(spotConfig.url);
      const fallbackDefaultUrl = normalizeUrl(config && config.redirectUrl);
      const longUrl = normalizeUrl(spotConfig.longUrl) || shortUrl || fallbackDefaultUrl;

      if (!shortUrl && !longUrl) return;

      const holdMs = Math.max(150, Number(spotConfig.holdDuration ?? 0.8) * 1000);

      const a = document.createElement('a');
      a.className = 'ar-dom-link';
      a.href = shortUrl || longUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.style.zIndex = String(zIndexVal);

      // 阻止手機長按跳出系統預設選單或拖曳連結
      a.addEventListener('contextmenu', (e) => e.preventDefault());
      a.addEventListener('dragstart', (e) => e.preventDefault());

      const linkState = {
        mesh: mesh,
        anchorEl: a,
        isPressed: false
      };

      let pressStartTime = 0;
      let holdTimer = null;
      let isLongPressTriggered = false;

      function clearHoldTimer() {
        if (holdTimer) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }
      }

      function onPressStart(e) {
        if (performance.now() - lastGlobalNavigateTime < 800) return;
        linkState.isPressed = true;
        pressStartTime = performance.now();
        isLongPressTriggered = false;
        a.href = shortUrl || longUrl;

        clearHoldTimer();

        if (longUrl) {
          holdTimer = setTimeout(() => {
            isLongPressTriggered = true;
            a.href = longUrl;
            hud.style.background = "rgba(147, 51, 234, 0.95)";
            hud.innerHTML = `🟣 長按已達標 (${(holdMs / 1000).toFixed(1)}s)！放開開啟長按連結`;
          }, holdMs);
        }
      }

      // 防止長按期間手指微幅晃動被手機誤判為捲動頁面而中斷觸控
      function onTouchMove(e) {
        if (linkState.isPressed && e.cancelable) {
          e.preventDefault();
        }
      }

      // 放開手指處理函式 (綁定於元素與全域 window，確保放開 100% 觸發)
      function onPressRelease(e) {
        if (!linkState.isPressed && !isLongPressTriggered) return;
        clearHoldTimer();

        const now = performance.now();
        const elapsed = pressStartTime > 0 ? (now - pressStartTime) : 0;
        const reachedLong = isLongPressTriggered || (longUrl && elapsed >= holdMs);

        linkState.isPressed = false;
        pressStartTime = 0;
        isLongPressTriggered = false;

        if (reachedLong && longUrl) {
          if (e && e.cancelable) e.preventDefault();
          launchTargetUrl(longUrl, true);
        }
      }

      function onTouchCancel(e) {
        clearHoldTimer();
        // 【關鍵保護】：若畫面已經顯示「🟣 長按已達標」，此時系統若發出 touchcancel 視為放開手指，直接開啟長按網頁！
        if (isLongPressTriggered && longUrl) {
          linkState.isPressed = false;
          pressStartTime = 0;
          isLongPressTriggered = false;
          launchTargetUrl(longUrl, true);
          return;
        }
        linkState.isPressed = false;
        pressStartTime = 0;
        isLongPressTriggered = false;
      }

      // 採用純粹的 touch 與 mouse 事件，徹底避免 pointerup 搶先吃掉 touchend 權限
      a.addEventListener('touchstart', onPressStart, { passive: true });
      a.addEventListener('touchmove', onTouchMove, { passive: false });
      a.addEventListener('touchend', onPressRelease, { passive: false });
      a.addEventListener('touchcancel', onTouchCancel);

      a.addEventListener('mousedown', onPressStart);
      window.addEventListener('touchend', onPressRelease, { passive: false });
      window.addEventListener('mouseup', onPressRelease);

      // 短按 (< holdDuration) 時，由瀏覽器原生 <a target="_blank"> click 開啟新分頁
      a.addEventListener('click', (e) => {
        clearHoldTimer();
        const now = performance.now();

        // 若長按已於 touchend 處理完畢，攔截重複 click
        if (now - lastGlobalNavigateTime < 800) {
          e.preventDefault();
          return;
        }

        const elapsed = pressStartTime > 0 ? (now - pressStartTime) : 0;
        const useLong = isLongPressTriggered || (longUrl && elapsed >= holdMs);

        linkState.isPressed = false;
        pressStartTime = 0;
        isLongPressTriggered = false;

        if (useLong && longUrl) {
          e.preventDefault();
          launchTargetUrl(longUrl, true);
        } else if (shortUrl) {
          lastGlobalNavigateTime = now;
          try { sessionStorage.setItem('ar_auto_resume', '1'); } catch (err) {}
          a.href = shortUrl;
          hud.style.background = "rgba(0, 122, 255, 0.95)";
          hud.innerHTML = "🔗 已於新分頁開啟【短按連結】";
        } else {
          e.preventDefault();
          hud.style.background = "rgba(245, 158, 11, 0.95)";
          hud.innerHTML = `⏳ 請長按 ${(holdMs / 1000).toFixed(1)} 秒以開啟此點位連結`;
        }
      });

      arLinkLayer.appendChild(a);
      trackedDomLinks.push(linkState);
    }

    // =========================================================
    // 3. 系統初始化：載入設定檔、同源 3D 引擎與雙壓縮解碼器
    // =========================================================
    async function init() {
      if (checkInAppBrowser()) return;

      try {
        const configPath = resolveProjectAssetUrl('config.json');
        statusMsg.innerText = `⏳ 1/3 正在讀取專案設定檔 (${configPath})...`;
        const res = await fetch(`${configPath}?t=${Date.now()}`);
        if (!res.ok) {
          throw new Error(`找不到此專案的設定檔 (${configPath})\n請確認專案代號是否正確，或先由後台完成發布！`);
        }
        config = await res.json();

        if (config.projectName) {
          projectTitleEl.innerText = config.projectName;
          document.title = `AR 觀看端 - ${config.projectName}`;
        }

        statusMsg.innerText = "⏳ 2/3 正在載入 3D 與 AR 核心引擎...";
        THREE = await import('three');
        const gltfMod = await import('three/addons/loaders/GLTFLoader.js');
        const dracoMod = await import('three/addons/loaders/DRACOLoader.js');
        const meshoptMod = await import('three/addons/libs/meshopt_decoder.module.js');
        const mindarModule = await import('mindar-image-three');

        GLTFLoader = gltfMod.GLTFLoader;
        DRACOLoader = dracoMod.DRACOLoader;
        MeshoptDecoder = meshoptMod.MeshoptDecoder;
        MindARThree = mindarModule.MindARThree;

        if (MeshoptDecoder && MeshoptDecoder.ready) {
          try { await MeshoptDecoder.ready; } catch (e) {}
        }

        if (THREE.ColorManagement) {
          THREE.ColorManagement.enabled = false;
        }

        statusMsg.innerText = "⏳ 3/3 正在檢查已設定的媒體與 3D 資產...";
        preloadPool.innerHTML = '';

        // A. 檢查並預載去背影片資產
        if (config.videos && Array.isArray(config.videos)) {
          for (let i = 0; i < config.videos.length; i++) {
            const vConf = config.videos[i];
            if (!vConf || vConf.enabled === false || !vConf.url) continue;

            const resolvedVideoUrl = resolveProjectAssetUrl(vConf.url);
            const exists = await checkAssetExists(resolvedVideoUrl);
            if (exists) {
              const v = document.createElement('video');
              v.src = `${resolvedVideoUrl}?t=${Date.now()}`;
              v.loop = true;
              v.muted = true;
              v.playsInline = true;
              v.setAttribute('loop', '');
              v.setAttribute('muted', '');
              v.setAttribute('playsinline', '');
              v.setAttribute('webkit-playsinline', '');
              v.setAttribute('preload', 'auto');
              v.crossOrigin = "anonymous";

              v.addEventListener('ended', () => {
                v.currentTime = 0;
                v.play().catch(() => {});
              });

              preloadPool.appendChild(v);
              v.load();
              validVideoItems.push({ index: i + 1, element: v, config: vConf });
            }
          }
        }

        // B. 檢查 3D 模型 (.glb) 資產
        if (config.models && Array.isArray(config.models)) {
          for (let i = 0; i < config.models.length; i++) {
            const mConf = config.models[i];
            if (!mConf || mConf.enabled === false || !mConf.url) continue;

            const resolvedModelUrl = resolveProjectAssetUrl(mConf.url);
            const exists = await checkAssetExists(resolvedModelUrl);
            if (exists) {
              validModelConfigs.push({ ...mConf, resolvedUrl: resolvedModelUrl });
            }
          }
        }

        // C. 檢查互動圖片與點位資產
        if (config.imageLayer && config.imageLayer.enabled && config.imageLayer.url) {
          const resolvedImgUrl = resolveProjectAssetUrl(config.imageLayer.url);
          const imgExists = await checkAssetExists(resolvedImgUrl);
          if (imgExists) {
            validImageLayer = { ...config.imageLayer, resolvedUrl: resolvedImgUrl };
          }
        }

        const hsCount = (validImageLayer && Array.isArray(validImageLayer.hotspots)) ? validImageLayer.hotspots.length : 0;
        const modelInfo = validModelConfigs.length > 0 ? ` + ${validModelConfigs.length} 個 3D 模型` : "";
        const imgInfo = validImageLayer ? ` + ${hsCount} 個互動點位` : "";
        statusMsg.innerText = `✅ 準備就緒（${validVideoItems.length} 支影片${modelInfo}${imgInfo}）\n請將鏡頭對準實體圖卡`;
        startBtn.innerText = "點擊啟動 AR 鏡頭";
        startBtn.disabled = false;
        startBtn.onclick = startAR;

        // 若為點擊長按連結後按「返回」回到本頁，自動無縫啟動相機續掃
        try {
          if (sessionStorage.getItem('ar_auto_resume') === '1') {
            startAR();
          }
        } catch (e) {}

      } catch (err) {
        console.error(err);
        statusMsg.className = 'text-error';
        statusMsg.innerText = `初始化失敗：\n${err.message}`;
        startBtn.innerText = "載入失敗";
      }
    }

    // =========================================================
    // 4. 啟動 AR 相機、掛載 3D 場景與點位投影迴圈
    // =========================================================
    async function startAR() {
      startBtn.disabled = true;
      startBtn.innerText = "相機啟動中...";

      validVideoItems.forEach(item => {
        item.element.play().catch(e => console.warn(`影片 ${item.index} 初始喚醒:`, e));
      });

      try {
        const container = document.querySelector("#ar-container");
        const mindPath = resolveProjectAssetUrl('targets.mind');

        const mindarThree = new MindARThree({
          container: container,
          imageTargetSrc: `${mindPath}?t=${Date.now()}`,
          uiLoading: "no",
          uiScanning: "no",
          filterMinCF: 0.001,
          filterBeta: 0.01,
          missTolerance: 5,
          warmupTolerance: 2
        });
        activeMindARInstance = mindarThree;

        const { renderer, scene, camera } = mindarThree;
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

        // =========================================================
        // 4.0 配置 3D 模型專用立體光影系統
        // =========================================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x666666, 2.0);
        scene.add(hemiLight);

        const mainDirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        mainDirLight.position.set(2, 4, 5);
        scene.add(mainDirLight);

        const fillDirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        fillDirLight.position.set(-2, -2, 3);
        scene.add(fillDirLight);

        const anchor = mindarThree.addAnchor(0);

        // =========================================================
        // 4.A 浮空文字看板 (純視覺展示，點擊不啟動連結)
        // =========================================================
        if (config.bannerEnabled !== false && config.bannerText && config.bannerText.trim() !== "") {
          const bannerTexture = createCleanBannerTexture(config.bannerText);
          const bannerW = 1.3, bannerH = 0.32;
          const bannerMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(bannerW, bannerH),
            new THREE.MeshBasicMaterial({
              map: bannerTexture,
              transparent: true,
              side: THREE.DoubleSide,
              depthWrite: false
            })
          );
          const baseBannerY = (config.bannerPosY !== undefined) ? Number(config.bannerPosY) : 0.65;
          bannerMesh.position.set(0, baseBannerY, 0.12);
          bannerMesh.renderOrder = 20;
          anchor.group.add(bannerMesh);
        }

        // =========================================================
        // 4.B 零殘影去背影片平面 (純視覺展示，點擊不啟動連結)
        // =========================================================
        const vShader = `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `;
        const fShader = `
          uniform sampler2D textureMap;
          uniform vec3 keyColor;
          uniform float similarity;
          uniform float smoothness;
          varying vec2 vUv;

          void main() {
            vec4 col = texture2D(textureMap, vUv);
            float diff = length(col.rgb - keyColor);
            float alpha = smoothstep(similarity, similarity + max(smoothness, 0.001), diff);
            if (alpha < 0.08) discard;
            gl_FragColor = vec4(col.rgb, col.a * alpha);
          }
        `;

        const activeVideoObjects = [];
        const basePlaneHeight = 0.55;

        validVideoItems.forEach((item, idx) => {
          const v = item.element;
          const vConfig = item.config;

          const vTexture = new THREE.VideoTexture(v);
          vTexture.minFilter = THREE.LinearFilter;
          vTexture.magFilter = THREE.LinearFilter;

          const scaleVal = Number(vConfig.scale || 1.0);
          const planeH = basePlaneHeight * scaleVal;

          const mat = new THREE.ShaderMaterial({
            uniforms: {
              textureMap: { value: vTexture },
              keyColor: { value: new THREE.Color(vConfig.keyColor || "#00ff00") },
              similarity: { value: Number(vConfig.similarity ?? 0.4) },
              smoothness: { value: Number(vConfig.smoothness ?? 0.1) }
            },
            vertexShader: vShader,
            fragmentShader: fShader,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(planeH, planeH), mat);

          const baseX = Number(vConfig.px || 0);
          const baseY = Number(vConfig.py || 0);
          const baseZ = 0.15 + idx * 0.02;
          const baseRY = THREE.MathUtils.degToRad(Number(vConfig.ry || 0));
          const baseRZ = THREE.MathUtils.degToRad(Number(vConfig.rz || 0));

          mesh.position.set(baseX, baseY, baseZ);
          mesh.rotation.set(0, baseRY, baseRZ);
          mesh.renderOrder = 10 + idx;

          anchor.group.add(mesh);

          activeVideoObjects.push({
            video: v,
            texture: vTexture,
            mesh: mesh,
            planeH: planeH,
            aspectCalibrated: false
          });
        });

        // =========================================================
        // 4.C 3D 模型 (.glb) 載入：含下載進度條 + Meshopt 解碼 + 量化網格防剔除 + 材質防黑
        // =========================================================
        const activeModelObjects = [];
        if (validModelConfigs.length > 0) {
          const gltfLoader = new GLTFLoader();
          gltfLoader.setCrossOrigin('anonymous');

          const dracoLoader = new DRACOLoader();
          dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
          gltfLoader.setDRACOLoader(dracoLoader);

          if (MeshoptDecoder) {
            gltfLoader.setMeshoptDecoder(MeshoptDecoder);
          }

          let loadedModelsCount = 0;
          modelProgressBar.style.display = 'block';

          validModelConfigs.forEach((mConf) => {
            const wrapperGroup = new THREE.Group();
            const mx = Number(mConf.px || 0);
            const my = Number(mConf.py || 0);
            const mz = Number(mConf.pz ?? 0.15);
            const rx = THREE.MathUtils.degToRad(Number(mConf.rx || 0));
            const ry = THREE.MathUtils.degToRad(Number(mConf.ry || 0));
            const rz = THREE.MathUtils.degToRad(Number(mConf.rz || 0));
            const userScale = Number(mConf.scale || 1.0);

            wrapperGroup.position.set(mx, my, mz);
            wrapperGroup.rotation.set(rx, ry, rz);
            anchor.group.add(wrapperGroup);

            const encodedUrl = `${encodeURI(mConf.resolvedUrl)}?t=${Date.now()}`;

            gltfLoader.load(
              encodedUrl,
              (gltf) => {
                const rawModel = gltf.scene || (gltf.scenes && gltf.scenes[0]);
                if (!rawModel) return;

                rawModel.traverse((child) => {
                  if (child.isMesh) {
                    child.frustumCulled = false;
                    if (child.geometry) {
                      child.geometry.computeBoundingBox();
                      child.geometry.computeBoundingSphere();
                    }
                    if (child.material) {
                      const mats = Array.isArray(child.material) ? child.material : [child.material];
                      mats.forEach(m => {
                        m.side = THREE.DoubleSide;
                        if (m.metalness !== undefined && m.metalness > 0.3) {
                          m.metalness = 0.15;
                        }
                        if (m.roughness !== undefined && m.roughness < 0.25) {
                          m.roughness = 0.55;
                        }
                        m.needsUpdate = true;
                      });
                    }
                  }
                });

                rawModel.updateMatrixWorld(true);
                const box = new THREE.Box3().setFromObject(rawModel);
                const size = new THREE.Vector3();
                const center = new THREE.Vector3();
                box.getSize(size);
                box.getCenter(center);

                let maxDim = Math.max(size.x, size.y, size.z);
                if (!isFinite(maxDim) || maxDim <= 0.0001) maxDim = 1.0;
                const normFactor = 0.65 / maxDim;

                rawModel.position.set(
                  -center.x * normFactor,
                  -center.y * normFactor,
                  -center.z * normFactor
                );
                rawModel.scale.setScalar(normFactor);

                const scaleHolder = new THREE.Group();
                scaleHolder.scale.setScalar(userScale);
                scaleHolder.add(rawModel);
                wrapperGroup.add(scaleHolder);

                let mixer = null;
                if (gltf.animations && gltf.animations.length > 0) {
                  mixer = new THREE.AnimationMixer(rawModel);
                  gltf.animations.forEach((clip) => {
                    mixer.clipAction(clip).play();
                  });
                }

                activeModelObjects.push({
                  wrapper: wrapperGroup,
                  mixer: mixer,
                  autoRotate: !!mConf.autoRotate,
                  baseRY: ry
                });

                loadedModelsCount++;
                if (loadedModelsCount >= validModelConfigs.length) {
                  modelProgressBar.style.color = '#10b981';
                  modelProgressBar.innerText = '✅ 3D 模型載入完成！';
                  setTimeout(() => {
                    modelProgressBar.style.display = 'none';
                  }, 1800);
                }
              },
              (xhr) => {
                const loadedMB = (xhr.loaded / (1024 * 1024)).toFixed(1);
                if (xhr.lengthComputable && xhr.total > 0) {
                  const totalMB = (xhr.total / (1024 * 1024)).toFixed(1);
                  const pct = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100));
                  modelProgressBar.innerText = `⏳ 正在載入 3D 模型... ${pct}% (${loadedMB}MB / ${totalMB}MB)`;
                } else {
                  modelProgressBar.innerText = `⏳ 正在載入 3D 模型... 已接收 ${loadedMB} MB`;
                }
              },
              (err) => {
                console.warn("3D 模型載入失敗:", mConf.resolvedUrl, err);
                modelProgressBar.style.color = '#ff4d4f';
                modelProgressBar.innerText = `⚠️ 3D 模型載入失敗`;
              }
            );
          });
        }

        // =========================================================
        // 4.D AR 互動圖片與「唯一可觸發連結的座標點位感應區」
        // =========================================================
        if (validImageLayer) {
          const imgGroup = new THREE.Group();
          const imgX = Number(validImageLayer.px || 0);
          const imgY = Number(validImageLayer.py || 0);
          const imgZ = Number(validImageLayer.pz ?? 0.10);
          const imgRY = THREE.MathUtils.degToRad(Number(validImageLayer.ry || 0));
          const imgRZ = THREE.MathUtils.degToRad(Number(validImageLayer.rz || 0));
          const imgScale = Number(validImageLayer.scale || 1.0);
          const isBodyHidden = !!validImageLayer.hideBody;

          imgGroup.position.set(imgX, imgY, imgZ);
          imgGroup.rotation.set(0, imgRY, imgRZ);
          anchor.group.add(imgGroup);

          const texLoader = new THREE.TextureLoader();
          texLoader.setCrossOrigin("anonymous");
          texLoader.load(`${validImageLayer.resolvedUrl}?t=${Date.now()}`, (imgTex) => {
            const imgW = imgTex.image.width || 1;
            const imgH = imgTex.image.height || 1;
            const aspect = imgW / imgH;

            const planeH = 0.65 * imgScale;
            const planeW = planeH * aspect;

            const imgMat = new THREE.MeshBasicMaterial({
              map: imgTex,
              transparent: true,
              opacity: isBodyHidden ? 0.0 : 1.0,
              side: THREE.DoubleSide,
              depthWrite: false
            });
            const imgMesh = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), imgMat);
            imgMesh.renderOrder = 15;
            imgGroup.add(imgMesh);

            const hotspots = Array.isArray(validImageLayer.hotspots) ? validImageLayer.hotspots : [];
            const minDim = Math.min(planeW, planeH);

            hotspots.forEach((spot, sIdx) => {
              const uvX = Number(spot.uvX ?? 0.5);
              const uvY = Number(spot.uvY ?? 0.5);
              const radiusRatio = Number(spot.radius ?? 0.15);

              const localX = (uvX - 0.5) * planeW;
              const localY = (0.5 - uvY) * planeH;

              const hsMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.0,
                side: THREE.DoubleSide,
                depthWrite: false
              });

              const hitSize = Math.max(0.04, minDim * radiusRatio);
              const hsMesh = new THREE.Mesh(new THREE.PlaneGeometry(hitSize, hitSize), hsMat);
              hsMesh.position.set(localX, localY, 0.01);
              hsMesh.userData = {
                halfW: hitSize / 2,
                halfH: hitSize / 2
              };

              imgGroup.add(hsMesh);
              registerHotspotDomLink(hsMesh, spot, 65 + sIdx);
            });
          });
        }

        // =========================================================
        // 4.E 追蹤狀態事件
        // =========================================================
        let lastLockedTime = 0;

        anchor.onTargetFound = () => {
          isTargetLocked = true;
          lastLockedTime = performance.now();
          hud.style.background = "rgba(40, 167, 69, 0.9)";
          hud.innerHTML = "🟢 目標已鎖定！";
          validVideoItems.forEach(item => {
            if (item.element.paused) item.element.play().catch(() => {});
          });
        };

        anchor.onTargetLost = () => {
          isTargetLocked = false;
          hud.style.background = "rgba(0, 0, 0, 0.75)";
          hud.innerHTML = "🟡 正在尋找目標圖卡...";
        };

        await mindarThree.start();

        overlay.style.display = 'none';
        hud.style.display = 'block';

        // =========================================================
        // 4.F 螢幕旋轉與「從新分頁或返回鍵回到本頁時」自動喚醒/重啟相機機制
        // =========================================================
        window.addEventListener('orientationchange', () => {
          setTimeout(() => window.dispatchEvent(new Event('resize')), 150);
          setTimeout(() => window.dispatchEvent(new Event('resize')), 350);
        });

        async function resumeARSessionOnReturn(e) {
          const camVideo = container.querySelector('video');
          // 檢查相機串流是否因頁面導向而被系統關閉 (ended)
          const streamDead = !camVideo || !camVideo.srcObject ||
            camVideo.srcObject.getVideoTracks().some(t => t.readyState === 'ended');

          if ((e && e.persisted) || streamDead) {
            try {
              if (activeMindARInstance) {
                activeMindARInstance.stop();
                await activeMindARInstance.start();
              }
            } catch (err) {
              window.location.reload();
              return;
            }
          } else if (camVideo && camVideo.paused) {
            camVideo.play().catch(() => {});
          }

          validVideoItems.forEach(item => {
            if (item.element.paused) item.element.play().catch(() => {});
          });
          hud.style.background = isTargetLocked ? "rgba(40, 167, 69, 0.9)" : "rgba(0, 0, 0, 0.75)";
          hud.innerHTML = isTargetLocked ? "🟢 目標已鎖定！" : "🟡 正在尋找目標圖卡...";
        }

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            resumeARSessionOnReturn();
          }
        });
        window.addEventListener('focus', () => resumeARSessionOnReturn());
        window.addEventListener('pageshow', (e) => resumeARSessionOnReturn(e));

        // =========================================================
        // 4.G 渲染迴圈：更新影片 + 更新 3D 模型動畫 + 投影點位連結
        // =========================================================
        const clock = new THREE.Clock();
        const cornerVec = new THREE.Vector3();

        renderer.setAnimationLoop(() => {
          const delta = clock.getDelta();
          const now = performance.now();
          if (isTargetLocked) {
            lastLockedTime = now;
          }

          activeVideoObjects.forEach(vo => {
            const v = vo.video;

            if (isTargetLocked) {
              if (v.duration > 0 && v.currentTime >= v.duration - 0.05) {
                v.currentTime = 0;
                v.play().catch(() => {});
              } else if (v.paused || v.ended) {
                if (v.ended) v.currentTime = 0;
                v.play().catch(() => {});
              }
            }

            if (v.readyState >= v.HAVE_CURRENT_DATA) {
              vo.texture.needsUpdate = true;

              if (!vo.aspectCalibrated && v.videoWidth > 0 && v.videoHeight > 0) {
                const aspect = v.videoWidth / v.videoHeight;
                vo.mesh.scale.set(aspect, 1, 1);
                vo.aspectCalibrated = true;
              }
            }
          });

          activeModelObjects.forEach(mo => {
            if (mo.mixer) {
              mo.mixer.update(delta);
            }
            if (mo.autoRotate) {
              mo.wrapper.rotation.y += delta * 1.2;
            }
          });

          renderer.render(scene, camera);

          const isLinkActive = isTargetLocked || (now - lastLockedTime < 1500);
          if (!isLinkActive) {
            for (let i = 0; i < trackedDomLinks.length; i++) {
              if (!trackedDomLinks[i].isPressed) {
                trackedDomLinks[i].anchorEl.style.display = 'none';
              }
            }
            return;
          }

          const canvasRect = renderer.domElement.getBoundingClientRect();
          if (canvasRect.width === 0 || canvasRect.height === 0) return;

          anchor.group.updateMatrixWorld(true);
          camera.updateMatrixWorld(true);

          for (let i = 0; i < trackedDomLinks.length; i++) {
            const item = trackedDomLinks[i];
            // 按壓倒數期間鎖定按鈕座標，避免手震偏離
            if (item.isPressed) continue;

            const mesh = item.mesh;
            const el = item.anchorEl;

            const geomParams = mesh.geometry.parameters;
            const localHW = (geomParams && geomParams.width) ? geomParams.width / 2 : (mesh.userData.halfW || 0.1);
            const localHH = (geomParams && geomParams.height) ? geomParams.height / 2 : (mesh.userData.halfH || 0.1);

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            const localCorners = [
              [-localHW, -localHH],
              [ localHW, -localHH],
              [ localHW,  localHH],
              [-localHW,  localHH]
            ];

            for (let c = 0; c < 4; c++) {
              cornerVec.set(localCorners[c][0], localCorners[c][1], 0);
              cornerVec.applyMatrix4(mesh.matrixWorld);
              cornerVec.project(camera);

              const sx = canvasRect.left + ((cornerVec.x + 1) * 0.5) * canvasRect.width;
              const sy = canvasRect.top + ((-cornerVec.y + 1) * 0.5) * canvasRect.height;

              if (sx < minX) minX = sx;
              if (sx > maxX) maxX = sx;
              if (sy < minY) minY = sy;
              if (sy > maxY) maxY = sy;
            }

            const boxW = Math.max(10, maxX - minX);
            const boxH = Math.max(10, maxY - minY);

            el.style.left = `${minX}px`;
            el.style.top = `${minY}px`;
            el.style.width = `${boxW}px`;
            el.style.height = `${boxH}px`;
            el.style.display = 'block';
          }
        });

      } catch (err) {
        console.error(err);
        startBtn.style.display = 'none';
        statusMsg.className = 'text-error';
        statusMsg.innerText = `相機或 AR 啟動失敗：\n${err.message}`;
      }
    }

    init();
  </script>
</body>
</html>
